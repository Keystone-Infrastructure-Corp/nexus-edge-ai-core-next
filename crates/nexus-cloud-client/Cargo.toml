[package]
name = "nexus-cloud-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Edge-side client for the cloud-console: tunnel, RPC dispatcher with actor_token verification, entitlement cache, and alert sink."

[lib]
name = "nexus_cloud_client"
path = "src/lib.rs"

[dependencies]
nexus-cloud-protocol = { workspace = true }
nexus-types = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
getrandom = "0.3"
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

ed25519-dalek = { workspace = true }

# Phase 1.8 — `enroll` flow + WSS tunnel body.
rcgen = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
# Public CA roots for verifying the WSS server cert when the cloud
# edge-gateway is fronted by Azure Container Apps (or any other
# managed ingress that terminates TLS with a public-CA-issued leaf).
# Used in addition to the internal CA chain from enrollment, never
# instead of it.
webpki-roots = "0.26"
futures-util = { workspace = true }

# BUG-133 — TCP_USER_TIMEOUT on the tunnel socket. Linux-only option, and
# the edge appliances are Linux; already in the tree transitively via tokio.
# `all` is socket2's feature gate for the extended sockopts, which is where
# `set_tcp_user_timeout` lives.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { workspace = true, features = ["all"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
serde_json = { workspace = true }
# `test-util` gives the paused clock the enqueue-timeout regression
# tests need — otherwise each would burn a real ENQUEUE_TIMEOUT.
# Mirrors nexus-storage-cloud's dev-dependency shape.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
