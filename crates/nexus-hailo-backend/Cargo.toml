[package]
name = "nexus-hailo-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HailoRT 4.x FFI + safe Rust wrappers for Hailo-8 inference (M_HAILO_EP)."

[features]
default = []
# When enabled on a Linux target, the crate `dlopen`s `libhailort.so.4`
# at runtime (via `libloading`) and exposes a real inference session.
# Build-time linking is intentional NOT used: HailoRT is distributed
# under the Hailo developer-zone EULA, which prevents us from caching
# the .deb in CI. Runtime-loading the SONAME lets every release tarball
# build on a clean Ubuntu runner with zero Hailo artifacts present, and
# the engine surfaces `Error::NotAvailable` on boxes where the operator
# never installed HailoRT (instead of failing to start).
#
# When the feature is off — or when the target is not Linux — every
# public entry point returns `Error::NotAvailable`, so downstream
# crates still build cross-platform on dev boxes without HailoRT.
linked = ["dep:libloading"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libloading = { workspace = true, optional = true }

[[bin]]
name = "nexus-hailo-probe"
path = "src/bin/nexus-hailo-probe.rs"
