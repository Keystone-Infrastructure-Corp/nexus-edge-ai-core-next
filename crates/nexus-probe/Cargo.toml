[package]
name = "nexus-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nexus_probe"
path = "src/lib.rs"

[[bin]]
name = "nexus-probe"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# Capability-based config generation: build a real `nexus_config::Config`
# from the detected `HardwareProfile` and serialize it to nexus.toml. This
# is the single source of truth for `/etc/nexus/nexus.toml` (the installer
# calls `nexus-probe emit-config`), so the output is guaranteed-parseable
# and `deny_unknown_fields`-clean by construction.
nexus-config = { workspace = true }
toml = { workspace = true }
