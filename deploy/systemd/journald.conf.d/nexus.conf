# Nexus Edge AI — journald size-cap drop-in.
#
# Source of truth checked into the repo at
# deploy/systemd/journald.conf.d/nexus.conf. Shipped in the release tarball at
# etc-templates/journald.conf.d/nexus.conf and installed by scripts/install.sh
# to /etc/systemd/journald.conf.d/nexus.conf on the host.
#
# WHY: the engine logs to the journal (journalctl -u nexus-engine); left
# unbounded, journald defaults to ~10% of the filesystem, which on an edge
# appliance is gigabytes of logs competing with clip storage. The engine runs
# as the unprivileged `nexus` user and cannot vacuum the journal at runtime, so
# we cap it here at install time — prevention rather than a disk-pressure cure.
# This complements the storage-safety reclaim ladder, which handles the things
# the engine CAN reach as `nexus` (clips, alert snapshots, the SQLite WAL, and
# the rolling metrics buffer).
#
# Apply on an already-installed box: re-run scripts/install.sh, or drop this
# file in and `sudo systemctl restart systemd-journald`.
[Journal]
# Hard cap on the persistent journal (/var/log/journal). journald deletes the
# oldest entries to stay under this.
SystemMaxUse=512M
# Always leave at least this much free on the journal's filesystem, even below
# SystemMaxUse — a direct backstop against logs filling the disk.
SystemKeepFree=1G
# Cap individual journal files so rotation is granular (old files drop off
# promptly instead of in one large chunk).
SystemMaxFileSize=64M
# Volatile journal in /run (RAM) when persistent storage is unavailable.
RuntimeMaxUse=128M
# Discard entries older than this regardless of size.
MaxRetentionSec=1month
