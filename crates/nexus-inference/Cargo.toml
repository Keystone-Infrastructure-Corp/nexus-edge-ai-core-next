[package]
name = "nexus-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Per-EP feature flags. Each EP feature implicitly enables the `ort`
# integration so building with e.g. `--features ep-openvino` is
# enough — no need to also pass `--features ort`.
ep-cpu      = ["ort"]
ep-openvino = ["ort"]
ep-cuda     = ["ort"]
ep-coreml   = ["ort"]
ep-tensorrt = ["ort"]
ep-directml = ["ort"]
ep-rocm     = ["ort"]
# ep-vulkan — Vulkan-accelerated inference via ORT's WebGPU EP on its
# Dawn->Vulkan backend (ONNX Runtime has NO native Vulkan EP; WebGPU IS
# the Vulkan path on Linux). Default accelerator for AMD GPUs that ROCm
# does not officially support (Phoenix iGPUs etc). Maps to `ort` only —
# NOT `ort/webgpu`: because we load ORT dynamically (`load-dynamic`),
# the WebGPU register path compiles without statically linking the
# provider; availability is a runtime concern of the dlopened .so (an
# ORT built from source with `--use_webgpu`), exactly like `ep-rocm`.
ep-vulkan   = ["ort"]
# M_HAILO_EP — Hailo-8 backend. Not an ORT EP (HailoRT is a parallel
# runtime); enabling this just pulls `nexus-hailo-backend` and asks
# it to link against the system `libhailort.so` (linux only). The
# router dispatches to HailoYoloDetector when a `.hef` file is
# resolved AND `inference.ep_priority` contains "hailo".
ep-hailo    = ["dep:nexus-hailo-backend", "nexus-hailo-backend/linked"]
# Wire ORT itself; selected automatically by any ep-* feature above.
# Listed separately so `--features ort` (no EPs) still compiles the
# session-builder code path for diagnostics / dry-runs — that build
# falls through to CPU at runtime via the fallback in
# `execution_providers::selected_for_priority`.
ort         = ["dep:ort", "dep:ndarray"]

[dependencies]
nexus-types = { workspace = true }
nexus-config = { workspace = true }
# M3.1 Phase F: needed by the Store-backed VisualPromptStore impl
# (used by both the engine and the nexus-inference-worker binary).
# The lib code only references it from the visual_store_sqlite
# module — pure-CPU / non-visual builds pay only the compile cost,
# not a runtime one.
nexus-store = { workspace = true }
async-trait = { workspace = true }
# M3.2: ensemble detector fans out members in parallel via
# futures::future::join_all. Keeps a single dep edge for the
# inference crate (tokio::join would also work but doesn't compose
# over a runtime-length Vec of futures without explicit pinning).
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
once_cell = { workspace = true }
chrono = { workspace = true }
rmp-serde = { workspace = true }

ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

# M_HAILO_EP — Hailo-8 inference backend (FFI to libhailort.so.4.23).
# Optional + brought in by the `ep-hailo` feature. On non-linux dev
# boxes the crate's `linked` feature is off and the public API
# returns `Error::NotAvailable`, so `--features ep-hailo` still
# builds cross-platform.
nexus-hailo-backend = { workspace = true, optional = true }

# nexus-inference-worker: out-of-process detector worker. Spawned by
# WorkerProcessBackend and driven over stdio with length-prefixed bincode.
# Kept in this crate (not nexus-engine) so the worker stays a thin shim
# over the Detector + worker_proto module that ships with the library.
[[bin]]
name = "nexus-inference-worker"
path = "src/bin/nexus-inference-worker.rs"

[dev-dependencies]
tokio = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
ndarray = { workspace = true }
