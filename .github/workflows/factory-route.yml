# Canonical copy: nexus-home/ci/.github/workflows/factory-route.yml. Copy it verbatim.
# Routes a work-order issue by its factory:<size> label. Every build runs on Claude:
# claude.yml builds factory:small and factory:medium, and this hands factory:large to the
# owner. An assigned factory:large issue has been claimed locally and is left alone.
name: Factory route

on:
  issues:
    types: [labeled]

permissions:
  issues: write

concurrency:
  group: factory-route-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      toJSON(github.event.issue.assignees) == '[]' && github.event.label.name == 'factory:large'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the spec label
        run: |
          # Read labels live: the event payload can predate labels added in the same call.
          spec="$(gh issue view "$ISSUE" --repo "$REPO" --json labels \
            --jq '.labels[].name | select(test("^spec:SPEC-[0-9]+$")) | ltrimstr("spec:")' | head -n 1)"
          echo "SPEC=$spec" >> "$GITHUB_ENV"

      - name: Hand large builds to the owner
        run: |
          gh label create needs:owner --repo "$REPO" >/dev/null 2>&1 || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label needs:owner
          if [ -z "$SPEC" ]; then
            body="factory:large: no \`spec:SPEC-NNN\` label, so there is nothing to build yet. Write and approve a spec first."
          else
            body="factory:large builds run locally. From a checkout of \`$REPO\`, run:

          \`\`\`text
          /implement-loop $SPEC
          \`\`\`

          Assign this issue to yourself when you start, so the router leaves it alone."
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body"
