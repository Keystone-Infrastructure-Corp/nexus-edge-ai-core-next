# Canonical copy: nexus-home/ci/.github/workflows/claude.yml. Edit it there;
# each repo carries a verbatim copy, and `nexus-setup --check` reports drift.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  claude:
    # The action itself also rejects actors without write access and bots.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'factory:medium') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'factory:fix-ci' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Label-triggered builds: 180 min, one at a time per repo. @claude mentions: 60 min, unqueued.
    timeout-minutes: ${{ github.event.action == 'labeled' && 180 || 60 }}
    concurrency:
      group: ${{ github.event.action == 'labeled' && format('claude-build-{0}', github.repository) || format('claude-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action's Claude GitHub App token exchange
      actions: read # read CI results and logs
    steps:
      - name: Write the build prompt
        id: prompt
        if: github.event.action == 'labeled'
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            spec=$(jq -r '[.issue.labels[].name | select(startswith("spec:")) | sub("^spec:"; "")] | first // ""' "$GITHUB_EVENT_PATH")
            # The label text goes into the prompt, so accept only the SPEC-NNN shape.
            if ! printf '%s' "$spec" | grep -Eq '^SPEC-[0-9]+$'; then
              echo "::error::factory:medium needs a spec:SPEC-NNN label (found '${spec}')"
              exit 1
            fi
            text="Work order #$ISSUE in $REPO. Run implement-loop for $spec: read AGENTS.md, then .agents/skills/implement-loop/SKILL.md, and follow it on the vault record $spec. Work on a new branch. When the loop passes, push it and open a draft pull request whose body starts with \"Closes #$ISSUE\" and carries the ledger. If you stop short, comment on #$ISSUE with what is left and why."
          else
            text="Pull request #$PR in $REPO has failing checks. Read them with \`gh pr checks $PR\` and \`gh run view <run-id> --log-failed\`. Read AGENTS.md, find the root cause, make the smallest fix, run the failing gate locally where you can, and push the fix to the PR branch $BRANCH. Then comment on #$PR with the cause, the fix and what you ran."
          fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      # The action works in $GITHUB_WORKSPACE, so the repo is checked out there.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nexus-home

      # checkout only writes inside the workspace; move it beside the repo so
      # `../nexus-home` resolves as it does locally.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nexus-home
          token: ${{ steps.app.outputs.token }}
          path: .nexus-home
          persist-credentials: false
      - run: mv .nexus-home ../nexus-home

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude Code prefers an API key over the OAuth token when both are set,
          # so the key is passed only when the OAuth secret is empty.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: ${{ github.workspace }}/../nexus-home
          plugins: nexus@nexus-home
          # An empty prompt keeps @claude mentions in interactive (tag) mode.
          prompt: ${{ steps.prompt.outputs.text }}
