[package]
name = "nexus-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Phase 10 / Phase E — optional WebRTC HD sub-pipeline (webrtcbin). Implies
# the base `gstreamer` feature; adds the -webrtc / -sdp bindings. Builds
# only on hosts with gst-plugins-bad + -base dev headers (Linux CI
# `system-libs` job, or a local GStreamer install), never on the default
# macOS build.
gstreamer-webrtc = ["gstreamer", "dep:gstreamer-webrtc", "dep:gstreamer-sdp"]

[dependencies]
nexus-types = { workspace = true }
nexus-config = { workspace = true }
nexus-bus = { workspace = true }
nexus-inference = { workspace = true }
nexus-tracker = { workspace = true }
nexus-rules = { workspace = true }
nexus-store = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
once_cell = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
image = { workspace = true }

gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-webrtc = { workspace = true, optional = true }
gstreamer-sdp = { workspace = true, optional = true }
# M2.2: streaming hash for cold-replication. Same dep version as
# `nexus-storage` to keep the workspace lock single-versioned.
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
