# AMD — generic AMD GPU appliance, Vulkan-first inference.
#
# This is the default tier for AMD-GPU boxes whose GPU is NOT officially
# supported by ROCm — Phoenix/Rembrandt iGPUs such as the Radeon 680M/780M
# (gfx1035/gfx1103) and other unsupported gfx targets. Inference runs through
# ONNX Runtime's WebGPU execution provider on its Dawn→Vulkan backend (ONNX
# Runtime has no native Vulkan EP; WebGPU IS the Vulkan path on Linux), with
# CPU as the terminal fallback.
#
# Officially-ROCm-supported AMD discrete GPUs (RDNA2 gfx1030, RDNA3
# gfx1100/1101/1102, CDNA gfx908/gfx90a/gfx942) do NOT use this tier — the
# installer routes them to a ROCm-primary configuration based on a static
# gfx/PCI allowlist. No `HSA_OVERRIDE_GFX_VERSION` workaround is used or
# required on this tier: unsupported gfx targets go to Vulkan instead of
# being force-fit onto an unsupported ROCm path.
#
# Soak target: 12–18 cameras at 1080p / 15 fps (yolo26n_640) on Vulkan.
# WebGPU/Vulkan dispatch is GPU-bound; actual throughput depends on the
# Vulkan driver (mesa RADV) and GPU memory residency.

[runtime]
# Typical AMD APU = 8C / 16T. Single inference worker (see [inference]);
# the runtime thread pool still has ample headroom for tracking + I/O.
worker_threads = 8
blocking_threads = 4

[runtime.clips]
# Real H.264-passthrough mp4 via the shared RTSP session (detector +
# recorder share one connection per camera via a `tee`). REQUIRES the
# engine to be built with `--features gstreamer`. Without this line
# the runtime default is `recorder = "stub"`, which writes 0-byte
# placeholder files — a common source of "clips don't play" reports.
recorder = "gstreamer"

[auth]
# Customer-facing default since M6 (see docs/ARCHITECTURE.md §11).
# First boot creates a single `admin` user with a one-time password
# printed once at WARN; sign in at `/login` and set a real password.
# The HS256 session-signing secret auto-provisions to
# `/var/lib/nexus/state/admin-secret` (mode 0600). Required because
# `api_bind` below is non-loopback — the engine refuses to run
# because every non-loopback bind needs an authenticating mode.
mode = "local"

[server]
api_bind = "0.0.0.0:8089"
ui_bind = "0.0.0.0:80"
ui_root = "/usr/share/nexus/ui"
# M-HTTPS Phase 1 — in-process TLS listener for the engine UI.
# `nexus-engine tls init` mints a self-signed leaf on first boot;
# Phase 3 cloud enrollment will overwrite with a cloud-issued leaf.
# With `redirect_http_to_https = true` (default), the `ui_bind`
# listener returns 308 to `https://<host>/<path>` so existing
# `http://nexus/` bookmarks land on TLS automatically.
https_bind = "0.0.0.0:443"
tls_cert_path = "/etc/nexus/tls/cert.pem"
tls_key_path  = "/etc/nexus/tls/key.pem"
# v0.1.36 — HSTS max-age. Runtime-gated: the engine emits the
# Strict-Transport-Security header ONLY when the leaf is the
# cloud-issued cert minted by enrollment-svc (M-HTTPS Phase 3).
# Self-signed bootstrap leaves never advertise HSTS, so this
# value is safe to leave on even before the appliance is
# enrolled with the cloud.
hsts_max_age_seconds = 31536000

[store]
url = "sqlite:///var/lib/nexus/nexus.db?mode=rwc"

[telemetry]
log_level = "info,nexus=debug"

[inference]
backend = "pool"
# Single worker for sequential GPU dispatch. Multiple workers on the
# same GPU without explicit user scheduling can cause ORT to serialize,
# losing performance.
workers = 1
restart_backoff_ms = 2000
fail_soft = true
# WebGPU(Vulkan) execution provider for AMD GPUs not supported by ROCm
# (Phoenix iGPUs etc). Falls through to CPU if no Vulkan driver/ICD is
# present or the render node is unreachable (no engine crash — WebGPU
# attach failure degrades gracefully). `webgpu` is an accepted alias.
ep_priority = ["vulkan", "cpu"]

[inference.model]
kind = "yolo"
pack_path = "/usr/share/nexus/models"  # baked into the Docker image; override to /var/lib/nexus/models for custom packs
# AMD / Vulkan = 640. Uses yolo26n_640.onnx (static shape, ONNX Runtime
# path). Same weights as the Hailo-8 HEF (COCO-trained, yolo26n-nano).
# WebGPU compute shaders on the Vulkan backend; throughput depends on
# GPU residency and the Vulkan driver (no on-chip NMS like Hailo).
preset = "640"
input_width = 640
input_height = 640
score_threshold = 0.30

[tracker]
# ByteTrack is CPU-bound; a modern APU at 16T has ample headroom for 24
# concurrent trackers (same tracker config as the Hailo-primary t24).
backend = "bytetrack"

[rules]
backend = "cel"

[bus]
backend = "broadcast"
# 24 cams × peak burst headroom. Same shape as t24 since the cam
# count is comparable.
capacity = 2048
