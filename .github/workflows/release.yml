# ---------------------------------------------------------------------------
# Release pipeline — bare-metal tarball only (Docker removed 2026-05-23).
#
# Triggered on `release: published`. Builds a self-contained Linux x86_64
# tarball with binaries, UI, ONNX models, ONNX-Runtime + OpenVINO shared
# libs, tier templates, systemd unit, and installer scripts, then attaches
# it to the GitHub Release.
#
# Operator workflow (zero manual asset upload required per engine cut):
#
#   gh release create vX.Y.Z --target main \
#     --title "vX.Y.Z" --generate-notes
#
# Model pack is decoupled from engine version. The workflow reads
# `pack_version` from `models/models-manifest.json` (git-tracked) and
# downloads the ONNX files from the matching `models-${PACK_VERSION}`
# GitHub Release. That release is cut ONCE per model rev (rarely),
# reused by every engine cut. Bumping the pack:
#
#   1. Regenerate ONNX (`python tools/models/gen_*.py --all-static`).
#   2. Bump `pack_version` in models/models-manifest.json.
#   3. Commit + push.
#   4. `gh release create models-vN --prerelease --title "Model pack vN"`
#      `gh release upload models-vN models/yolo26n_*.onnx \`
#         `models/yolo_world_v2_s_*.onnx models/yoloe26_s_*.onnx \`
#         `models/dinov2_s_224.onnx \`
#         `models/models-manifest.json`
#
# `yolo26n.pt` is not a public ultralytics checkpoint, so the operator
# must run step 1 locally — GH-hosted runners cannot regenerate it.
# yolo_world / yoloe ONNX could be runner-generated but the codepath
# isn't wired since they piggyback on the same pack-version cadence.
#
# Engine release assets (small surface, no per-cut ONNX duplication):
#   * <tarball>.tar.gz                  (includes share/models/ for install.sh)
#   * <tarball>.tar.gz.sha256
#   * <tarball>.tar.gz.manifest.sig    (when NEXUS_RELEASE_SIGNING_KEY set)
#   * bootstrap.sh                     (= scripts/bootstrap.sh)
#
# Docker / GHCR publishing was removed when the LAN-management feature
# replaced the docker-compose install path with bare-metal systemd. The
# previous `image` job and `ghcr.io/<owner>/nexus-engine:*` images stay
# reachable for anyone with a pinned tag but no new images are pushed.
# ---------------------------------------------------------------------------

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish (e.g. v0.1.10). The GitHub Release with this tag must already exist."
        required: true
        type: string
      channel:
        description: "Channel to publish this run on. `auto` keeps the default mapping (prerelease -> beta, full release -> stable) and honours the NEXUS_CLOUD_RELEASE_CHANNEL repo variable. Anything else applies to THIS RUN ONLY."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - dev
          - beta
          - stable

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # tarball — bare-metal release artifact.
  #
  # Builds a self-contained release tarball:
  #
  #   nexus-edge-vX.Y.Z-linux-x86_64.tar.gz
  #   ├── VERSION                         (just "vX.Y.Z\n")
  #   ├── MANIFEST.json                   (every file + sha256)
  #   ├── MANIFEST.json.sig               (Ed25519, when signing key set)
  #   ├── bin/
  #   │   ├── nexus-engine                (FEATURES=gstreamer,gstreamer-webrtc,
  #   │   │                                ort,ep-cpu,ep-openvino,ep-cuda,
  #   │   │                                ep-tensorrt,ep-hailo,ep-rocm,ep-vulkan)
  #   │   ├── nexus-probe
  #   │   └── nexus-doctor
  #   ├── lib/onnxruntime/                (libonnxruntime.so + OpenVINO
  #   │                                    EP + intel CPU/GPU/NPU plugins,
  #   │                                    extracted from the wheel)
  #   ├── share/
  #   │   ├── ui/                         (ui/dist/)
  #   │   ├── models/                     (default model pack, pulled
  #   │   │                                from models-${PACK_VERSION}
  #   │   │                                release at workflow runtime)
  #   │   └── apt-requirements.txt        (runtime apt deps; consumed by
  #   │                                    install.sh + the OTA
  #   │                                    nexus-apply-deps wrapper)
  #   ├── etc-templates/
  #   │   ├── nexus.example.toml             (reference only — the live
  #   │   │                                  /etc/nexus/nexus.toml is GENERATED
  #   │   │                                  by `nexus-probe emit-config`)
  #   │   └── systemd/nexus-engine.service
  #   └── scripts/
  #       ├── install.sh                  (in-tarball installer)
  #       ├── uninstall.sh
  #       ├── nexus-apply-release         (single root-owned OTA applier;
  #       │                                copied to /usr/local/sbin on install)
  #       ├── nexus-apply-deps            (pinned OTA runtime-dep installer;
  #       │                                copied to /usr/local/sbin on install)
  #       └── lib/install-common.sh
  # -------------------------------------------------------------------------
  # ----------------------------------------------------------------
  # Cross-build the gst-plugins-rs `rtp` plugin (libgstrsrtp.so) which
  # carries `rtpgccbwe` — Google Congestion Control + pacing for the HD
  # WebRTC transcode. Not apt-installable on Ubuntu, so we build it from
  # the 0.13 branch (gstreamer 1.24 series, matching the target boxes)
  # on a 24.04 runner and bundle the .so into the tarball under
  # lib/gstreamer-1.0/. Best-effort: on any failure the job still exits
  # 0, no artifact is produced, and the release ships without the plugin
  # (the engine falls back to the loss-based AIMD controller).
  # ----------------------------------------------------------------
  rtp-plugin:
    name: build rtpgccbwe plugin (gst-plugins-rs)
    runs-on: ubuntu-24.04
    # Engine releases only. `models-*` tags are data-only model-pack releases
    # (see header) reused by every engine cut — they must not stamp their tag
    # into Cargo.toml's `version` or build an engine tarball. Without this
    # guard, publishing `models-vN` fails the run at the version stamp
    # ("unexpected character 'm' while parsing major version number").
    #
    # `stable`/`beta`/`dev` are excluded for the same reason: they are the
    # floating channel pointers this workflow publishes (ADR-080), and the
    # version stamp would write `version = "stable"` into Cargo.toml without
    # erroring, failing later somewhere far less obvious. Creating a pointer
    # cannot re-enter this workflow — GitHub does not start runs from events
    # its own GITHUB_TOKEN raised — but `workflow_dispatch` is exempt from
    # that rule and takes `tag` as free text, so the guard is reachable.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag, 'models-') && !contains(fromJSON('["stable", "beta", "dev"]'), github.event.release.tag_name || github.event.inputs.tag) }}
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: install GStreamer 1.24 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential git \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools

      - name: build libgstrsrtp.so (best-effort)
        run: |
          set -uo pipefail
          mkdir -p out
          if git clone --depth 1 --branch 0.13 \
               https://github.com/GStreamer/gst-plugins-rs.git gpr \
             && ( cd gpr && cargo build --release -p gst-plugin-rtp ) \
             && [ -f gpr/target/release/libgstrsrtp.so ]; then
            cp gpr/target/release/libgstrsrtp.so out/
            echo "built libgstrsrtp.so ($(du -h out/libgstrsrtp.so | cut -f1))"
            # Strip debug symbols: the unstripped cdylib is ~63M, ~5-8M stripped.
            # Pure size win — `--strip-unneeded` keeps the exported dynamic
            # symbols (incl. the gst plugin descriptor) the loader needs, so the
            # gst-inspect check below still validates the stripped artifact.
            strip --strip-unneeded out/libgstrsrtp.so || echo "::warning::strip failed; shipping unstripped .so"
            echo "stripped libgstrsrtp.so ($(du -h out/libgstrsrtp.so | cut -f1))"
            # The built plugin MUST expose rtpgccbwe or it is useless to us.
            if GST_PLUGIN_PATH="$PWD/out" gst-inspect-1.0 rtpgccbwe >/dev/null 2>&1; then
              echo "rtpgccbwe registered OK"
            else
              echo "::warning::built plugin does not expose rtpgccbwe; dropping it"
              rm -f out/libgstrsrtp.so
            fi
          else
            echo "::warning::gst-plugin-rtp build failed; release ships without rtpgccbwe (AIMD fallback)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rtpgccbwe-plugin
          path: out/
          if-no-files-found: warn
          retention-days: 1

  # -------------------------------------------------------------------------
  # resolve-channel — the one place this run's channel is decided.
  #
  # Two consumers need the same answer: the `tarball` job's channel-pointer
  # step (which decides what a brand-new box installs) and
  # `publish-release-manifest` (which tells the cloud orchestrator what an
  # already-enrolled fleet may update to). Computing it twice lets them
  # drift, and drift here means a box that installed "stable" is not on the
  # channel the cloud believes it is on.
  #
  # Precedence: per-run dispatch input > NEXUS_CLOUD_RELEASE_CHANNEL repo
  # variable > GitHub's own prerelease flag.
  # -------------------------------------------------------------------------
  resolve-channel:
    name: resolve release channel
    runs-on: ubuntu-22.04
    # Engine releases only — see the rtp-plugin guard above.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag, 'models-') && !contains(fromJSON('["stable", "beta", "dev"]'), github.event.release.tag_name || github.event.inputs.tag) }}
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      # SPEC-068 Phase 6 — `NEXUS_CLOUD_RELEASE_CHANNEL` is a repo variable, so
      # it applies to every run at once: setting it to `dev` to get one build
      # onto engineering's cores also redirects the next real release, and
      # forgetting to unset it is silent. The dispatch input below overrides it
      # for a single run and cannot be left switched on.
      CHANNEL_OVERRIDE: ${{ vars.NEXUS_CLOUD_RELEASE_CHANNEL }}
      CHANNEL_INPUT: ${{ github.event.inputs.channel }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: resolve
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A workflow_dispatch re-publish carries no release payload, so ask
          # the API rather than letting an empty flag default a prerelease
          # onto `stable`.
          is_prerelease="${IS_PRERELEASE:-}"
          if [[ -z "$is_prerelease" ]]; then
            is_prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease')"
          fi

          # `auto` (and the empty value a `release` event produces) means
          # "no per-run opinion".
          if [[ -n "${CHANNEL_INPUT:-}" && "${CHANNEL_INPUT}" != "auto" ]]; then
            channel="$CHANNEL_INPUT"
          elif [[ -n "${CHANNEL_OVERRIDE:-}" ]]; then
            channel="$CHANNEL_OVERRIDE"
          elif [[ "$is_prerelease" == "true" ]]; then
            channel="beta"
          else
            channel="stable"
          fi

          # The repo variable is free-form text and this value now names a
          # release tag, so anything off the allowlist stops the run.
          case "$channel" in
            dev | beta | stable) ;;
            *)
              echo "::error::unsupported channel '${channel}' (expected dev, beta, or stable)"
              exit 1
              ;;
          esac

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "$TAG resolves to the '$channel' channel (prerelease=$is_prerelease)"

  tarball:
    name: build + attach bare-metal tarball
    runs-on: ubuntu-22.04
    needs: [rtp-plugin, resolve-channel]
    # Engine releases only — skip data-only `models-*` model-pack tags (the
    # `register release with cloud orchestrator` job `needs: tarball`, so it
    # skips too). See the rtp-plugin guard above for the rationale.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag, 'models-') && !contains(fromJSON('["stable", "beta", "dev"]'), github.event.release.tag_name || github.event.inputs.tag) }}
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      ORT_VERSION: "1.24.1"
      # `gstreamer-webrtc` (implies base `gstreamer`) builds the Phase 10 HD
      # live-view sub-pipeline (webrtcbin). Requires libgstreamer-plugins-bad1.0-dev
      # at build time (added to the apt step below) and gstreamer1.0-nice +
      # gstreamer1.0-plugins-bad on the box at runtime (install-common.sh).
      FEATURES: "gstreamer,gstreamer-webrtc,ort,ep-cpu,ep-openvino,ep-cuda,ep-tensorrt,ep-hailo,ep-rocm,ep-vulkan"
    permissions:
      contents: write   # required to `gh release upload`
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ----------------------------------------------------------------
      # Bump every version sink in the working tree to match the release
      # tag BEFORE any compile or `npm ci` runs.
      #
      # Why this instead of relying on `build.rs`'s NEXUS_RELEASE_VERSION
      # path alone: build.rs only feeds `nexus-engine`. The release
      # tarball also ships
      #
      #   * `nexus-sinks` (outbound webhook `User-Agent`)
      #   * `nexus-telemetry` (OTel `service.version` resource attr)
      #   * `nexus-doctor` / `nexus-probe` (`--version` flag)
      #   * the UI bundle (`ui/package.json` version)
      #
      # all of which read `CARGO_PKG_VERSION` / `package.json` directly.
      # Sed-bumping the workspace + UI version makes every one of those
      # surfaces report the same `X.Y.Z` automatically, with zero
      # runtime knobs to keep in sync.
      #
      # The tree edits are local to the runner; nothing is committed
      # back, so the canonical `Cargo.toml` stays at `0.1.0` for dev.
      # ----------------------------------------------------------------
      - name: bump workspace + UI version to ${{ env.TAG }}
        run: |
          set -euo pipefail
          version_no_v="${TAG#v}"
          version_no_v="${version_no_v#V}"
          echo "Bumping every version sink to $version_no_v (TAG=$TAG)"
          # workspace.package.version — `sed -E` is GNU on the runner;
          # the address restricts the substitution to the
          # `[workspace.package]` section so transitive dep versions
          # in `[workspace.dependencies]` are left alone.
          sed -i -E "/^\[workspace\.package\]/,/^\[/ s/^version = \"[^\"]+\"$/version = \"$version_no_v\"/" Cargo.toml
          grep -E '^version = "' Cargo.toml | head -1
          # UI package.json — jq for surgical, portable replacement
          # (sed's `0,/regex/` first-match address is GNU-only and
          # we'd rather not depend on a runner-specific sed extension
          # when jq is already installed on every GH-hosted runner).
          jq --arg v "$version_no_v" '.version = $v' ui/package.json > ui/package.json.tmp
          mv ui/package.json.tmp ui/package.json
          grep '"version":' ui/package.json | head -1
          # Cargo.lock will be regenerated transparently by the next
          # `cargo build` because the workspace members' `version`
          # fields changed. We deliberately do NOT run
          # `cargo update --workspace` here — that would also bump
          # every transitive dep to its latest semver-compatible
          # version, defeating the point of a pinned `Cargo.lock`.

      # ----------------------------------------------------------------
      # Stage the model pack from the dedicated `models-${PACK_VERSION}`
      # release. PACK_VERSION is read from `models/models-manifest.json`
      # (committed at the repo root), so an engine cut just inherits
      # whatever pack the manifest declares — no per-tag re-upload.
      #
      # Bumping the model pack:
      #   1. Regenerate ONNX (`python tools/models/gen_*.py --all-static`).
      #   2. Bump `pack_version` in models/models-manifest.json.
      #   3. Commit + push.
      #   4. `gh release create models-vN --prerelease --title "Model pack vN"`
      #      `gh release upload models-vN models/yolo26n_*.onnx \`
      #         `models/yolo_world_v2_s_*.onnx models/yoloe26_s_*.onnx \`
      #         `models/dinov2_s_224.onnx \`
      #         `models/models-manifest.json`
      #
      # `--prerelease` on the models-* tag keeps it off the "Latest"
      # badge so it doesn't surface to operators downloading the engine.
      #
      # Auto-generation on the runner was considered but `yolo26n.pt` is
      # not a public ultralytics checkpoint — only the operator can run
      # the gen scripts.
      # ----------------------------------------------------------------
      - name: read model pack version
        id: model_pack
        run: |
          set -euo pipefail
          v="$(jq -r '.pack_version // empty' models/models-manifest.json)"
          if [[ -z "$v" ]]; then
            echo "::error::models/models-manifest.json is missing the 'pack_version' field. Set it to e.g. \"v1\" and cut the matching 'models-v1' release."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Engine release $TAG will pull models from 'models-$v' release."

      - name: stage model pack from models-${{ steps.model_pack.outputs.version }} release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACK_TAG: models-${{ steps.model_pack.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p models
          # --clobber is required because models-manifest.json is also
          # uploaded as an asset to the pack release; the asset copy
          # carries the per-pack sha256 values and MUST win over the
          # committed copy that actions/checkout placed on disk.
          gh release download "$PACK_TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'yolo26n_*x*.onnx' \
            --pattern 'yolo_world_v2_s_*x*.onnx' \
            --pattern 'yoloe26_s_*x*.onnx' \
            --pattern 'dinov2_s_224.onnx' \
            --pattern 'yolo26n_*_hailo.hef' \
            --pattern 'yolo_world_v2_s_*_hailo.hef' \
            --pattern 'yoloe26_s_*_hailo.hef' \
            --pattern 'dinov2_s_*_hailo.hef' \
            --pattern 'models-manifest.json' \
            --dir models/ \
            --clobber
          echo "Staged model pack from $PACK_TAG:"
          ls -la models/
          # Detectors ship as native-16:9 static-shape exports on the
          # ladder (512x288 / 1024x576 / 1536x864). Static
          # shapes are mandatory for the Intel NPU plugin (silent CPU
          # fallback on dynamic shapes, observed on Lunar Lake k13 under
          # v0.1.18).
          #
          # dinov2_s_224.onnx is the Phase 5.6 appearance-embedding
          # backbone (Meta facebook/dinov2-small, Apache-2.0). 384-dim
          # CLS token per 224x224 RGB crop. Added in pack v2.
          #
          # Hailo-8 HEFs (`*_hailo.hef`, pack v4+) are tolerated-missing:
          # the engine falls through to the ONNX path on any host that
          # doesn't have an actual Hailo chip, and the HEF compile
          # toolchain (Hailo DFC) is Linux-x86_64-only and gated behind a
          # free Hailo Dev Zone account. Operators run
          # `python tools/models/gen_*_hailo.py` after acquiring DFC,
          # then `gh release upload models-vN models/*_hailo.hef`. We
          # only check the ONNX files in the required-files loop below.
          # The required ONNX set is derived from models-manifest.json
          # (the single source of truth; jq is pre-installed on the
          # GitHub runner image) so a NEW native-16:9 shape can never be
          # silently absent from the pack. HEFs stay tolerated-missing.
          required_onnx=$(jq -r '.models[].artifacts[] | select(.backend=="onnx") | .path' models/models-manifest.json | sort -u)
          for f in $required_onnx models-manifest.json; do
            if [ ! -s "models/$f" ]; then
              echo "::error::Required model asset 'models/$f' missing from release $PACK_TAG (expected per models-manifest.json). Upload via 'gh release upload $PACK_TAG models/$f' (or bump pack_version in models/models-manifest.json to a release that has it)."
              exit 1
            fi
          done

      # ----------------------------------------------------------------
      # Engine build deps (mirrors ci.yml `system-libs` job).
      # ----------------------------------------------------------------
      - name: install build deps
        run: |
          sudo apt-get update
          # libunwind-dev: required for libgstreamer1.0-dev on
          # ubuntu-22.04 (24.04 resolves it transitively, 22.04 does
          # not). We pin to 22.04 here for older-glibc compat so the
          # binary tarball runs on the broadest set of target distros.
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential cmake \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-tools \
            libssl-dev jq

      - name: install ONNX Runtime ${{ env.ORT_VERSION }} (for cargo link)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | sudo tar -xz -C /opt
          sudo mv "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          # shared-key MUST NOT contain commas (Swatinem/rust-cache@v2
          # rejects them via checkKey). Use a stable hand-picked label
          # instead of interpolating ${{ env.FEATURES }} which is the
          # comma-separated feature list.
          shared-key: tarball-all-eps

      - name: cargo build (release, all EPs)
        env:
          ORT_LIB_LOCATION: /opt/onnxruntime/lib
          # Surfaced as `env!("NEXUS_BUILD_VERSION")` in
          # `crates/nexus-engine/build.rs` so the engine reports the
          # release tag (stripped of the leading `v`) on
          # `GET /healthz`, the cloud-tunnel handshake, the setup
          # endpoint, the tracing boot line, and the diagnostics
          # bundle's `build-info.json` instead of the placeholder
          # `0.1.0` from `CARGO_PKG_VERSION`.
          NEXUS_RELEASE_VERSION: ${{ env.TAG }}
        run: |
          set -euo pipefail
          cargo build --release -p nexus-engine \
            --features "$FEATURES" \
            --bin nexus-engine --bin nexus-doctor
          cargo build --release -p nexus-probe --bin nexus-probe

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: build UI
        run: |
          set -euo pipefail
          cd ui
          npm ci --no-fund --no-audit
          npm run build

      # Pull the OpenVINO-enabled libonnxruntime.so (and the intel
      # CPU/GPU/NPU plugins + TBB) out of the matching-ABI Python wheel.
      #
      # onnxruntime-openvino >= 1.24 ships only cp311/cp312/cp313 wheels;
      # ubuntu-22.04's default `python3` is 3.10 and `pip install` quietly
      # filters the whole 1.24.x line out as "no matching distribution"
      # (looks identical to the version having been yanked). Pin Python
      # 3.11 here so pip can resolve the cp311 manylinux wheel.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: stage ONNX Runtime + OpenVINO libs
        run: |
          set -euo pipefail
          python -m pip install --target /tmp/ovwheel \
            "onnxruntime-openvino==${ORT_VERSION}"
          mkdir -p stage/lib/onnxruntime
          cp -aP /tmp/ovwheel/onnxruntime/capi/*.so* stage/lib/onnxruntime/
          # `plugins.xml` is OpenVINO Core's device registry — without it,
          # `Core::get_available_devices()` returns an empty list and
          # `ParseDeviceType("NPU")` rejects with `[OpenVINO] You have
          # selected wrong configuration value for the key 'device_type'`,
          # silently falling back to CPU. The wheel ships it alongside the
          # plugin .so files in capi/, but it's not matched by `*.so*`.
          if [ -f /tmp/ovwheel/onnxruntime/capi/plugins.xml ]; then
            cp /tmp/ovwheel/onnxruntime/capi/plugins.xml \
               stage/lib/onnxruntime/plugins.xml
          else
            # Wheel layout changed? Fall back to writing the canonical
            # OV 2025.x plugin registry directly so the release isn't
            # silently broken.
            cat > stage/lib/onnxruntime/plugins.xml <<'PLUGINS_XML'
          <ie>
              <plugins>
                  <plugin location="libopenvino_intel_cpu_plugin.so" name="CPU"/>
                  <plugin location="libopenvino_intel_gpu_plugin.so" name="GPU"/>
                  <plugin location="libopenvino_intel_npu_plugin.so" name="NPU"/>
                  <plugin location="libopenvino_auto_plugin.so" name="AUTO"/>
                  <plugin location="libopenvino_auto_plugin.so" name="MULTI"/>
                  <plugin location="libopenvino_auto_plugin.so" name="BATCH"/>
                  <plugin location="libopenvino_hetero_plugin.so" name="HETERO"/>
              </plugins>
          </ie>
          PLUGINS_XML
          fi
          # The ort crate dlopens libonnxruntime.so (unversioned);
          # the wheel only ships the .so.${ORT_VERSION} soname.
          if [ ! -e "stage/lib/onnxruntime/libonnxruntime.so" ]; then
            ln -s "libonnxruntime.so.${ORT_VERSION}" \
                  "stage/lib/onnxruntime/libonnxruntime.so"
          fi
          # Sanity: every plugin referenced in plugins.xml must exist.
          # Fails the release loudly rather than shipping a broken tarball.
          missing=0
          for so in $(grep -oE 'location="[^"]+"' stage/lib/onnxruntime/plugins.xml | sed 's/location="//;s/"//'); do
            if [ ! -e "stage/lib/onnxruntime/$so" ]; then
              echo "::error::plugins.xml references $so but it is not in stage/"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      # Pull the libgstrsrtp.so built by the rtp-plugin job. continue-on-error
      # so a missing/empty artifact (build failed upstream) doesn't block the
      # release — the assemble step below tolerates the file being absent.
      - name: download rtpgccbwe plugin
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rtpgccbwe-plugin
          path: rtp-plugin

      - name: assemble release tree
        run: |
          set -euo pipefail
          R="stage"
          mkdir -p "$R/bin" "$R/share/ui" "$R/share/models" \
                   "$R/etc-templates/systemd" \
                   "$R/etc-templates/journald.conf.d" \
                   "$R/etc-templates/sudoers.d" \
                   "$R/scripts/lib"

          install -m 0755 target/release/nexus-engine "$R/bin/"
          install -m 0755 target/release/nexus-probe  "$R/bin/"
          install -m 0755 target/release/nexus-doctor "$R/bin/"

          # Bundled gst-plugins-rs rtpgccbwe (paced congestion control),
          # built by the rtp-plugin job against gst 1.24. Optional — the
          # engine registers it via GST_PLUGIN_PATH (see
          # register_bundled_gst_plugins in nexus-engine main.rs) and falls
          # back to the AIMD controller if absent/unloadable on the box.
          if [ -f rtp-plugin/libgstrsrtp.so ]; then
            mkdir -p "$R/lib/gstreamer-1.0"
            install -m 0755 rtp-plugin/libgstrsrtp.so "$R/lib/gstreamer-1.0/"
            echo "bundled rtpgccbwe plugin (libgstrsrtp.so)"
          else
            echo "no rtpgccbwe plugin artifact — shipping without (AIMD fallback)"
          fi

          cp -a ui/dist/. "$R/share/ui/"
          # dinov2_s_224.onnx is the Phase 5.6 appearance-embedding
          # backbone — required at runtime when `[reid].enabled=true`
          # and `model_path=None` so the engine resolves the real
          # extractor (model_id "dinov2-s-v1") instead of falling back
          # to the mock (model_id "mock_dinov2-s-v1") which the cloud
          # edge-gateway allowlist correctly rejects.
          # ONNX set is manifest-driven (single source of truth, jq
          # pre-installed on the runner) so a new native-16:9 shape is
          # staged automatically. The required-files check above already
          # verified every one of these exists on disk.
          onnx=()
          while IFS= read -r p; do onnx+=("models/$p"); done < <(
              jq -r '.models[].artifacts[] | select(.backend=="onnx") | .path' models/models-manifest.json | sort -u
          )
          cp -a "${onnx[@]}" models/models-manifest.json "$R/share/models/"
          # Hailo-8 HEFs (pack v4+) — tolerated-missing per the pattern
          # whitelist in the download step. Operators on non-Hailo boxes
          # never look at these files; on Hailo boxes the engine resolves
          # `<name>_hailo.hef` next to the matching ONNX in the model pack
          # (see `build_detector_for_yolo` in crates/nexus-inference). The
          # shopt+nullglob makes the glob expand to nothing when no HEFs
          # were uploaded to the pack release (pre-v4 pack tags).
          shopt -s nullglob
          hefs=(models/*_hailo.hef)
          shopt -u nullglob
          if (( ${#hefs[@]} )); then
              echo "staging ${#hefs[@]} HEF(s) into share/models/"
              cp -a "${hefs[@]}" "$R/share/models/"
          else
              echo "no HEFs in models/ — ONNX-only pack (pre-v4 or partial pack)"
          fi

          # The live config is GENERATED on-box by `nexus-probe emit-config`
          # (see scripts/install.sh emit_config); nexus.example.toml ships as a
          # human-readable reference only. The old per-box templates were
          # retired with the capability-based generator (M_HWCONFIG).
          cp config/nexus.example.toml   "$R/etc-templates/nexus.example.toml"

          cp deploy/systemd/nexus-engine.service \
             "$R/etc-templates/systemd/nexus-engine.service"

          # journald size-cap drop-in (bounds engine log growth on the box —
          # scripts/install.sh installs it to /etc/systemd/journald.conf.d/).
          cp deploy/systemd/journald.conf.d/nexus.conf \
             "$R/etc-templates/journald.conf.d/nexus.conf"

          # Phase 9 (M_OTA) — the OTA apply path shells out to `sudo`
          # for the three pinned commands whitelisted here. Installed by
          # scripts/install.sh to /etc/sudoers.d/nexus-update (0440 root).
          cp deploy/sudoers.d/nexus-update \
             "$R/etc-templates/sudoers.d/nexus-update"
          # ADR-066 — the remote-support grant. Installed by scripts/install.sh
          # on a fresh install and by nexus-apply-release (ssh-ca-install) on an
          # already-deployed box, so it reaches the fleet over the air.
          cp deploy/sudoers.d/nexus-diag \
             "$R/etc-templates/sudoers.d/nexus-diag"

          cp scripts/install.sh   "$R/scripts/"
          cp scripts/uninstall.sh "$R/scripts/"
          cp scripts/enable-nics.sh "$R/scripts/"
          cp scripts/lib/install-common.sh "$R/scripts/lib/"
          cp scripts/lib/release-pubkey.pem "$R/scripts/lib/"

          # Phase 10 — runtime-dependency auto-install on OTA. The declared
          # apt deps (share/apt-requirements.txt) plus the pinned root-owned
          # installer (scripts/nexus-apply-deps) that the OTA apply path runs
          # via sudo; scripts/install.sh copies the wrapper to
          # /usr/local/sbin/nexus-apply-deps (root:root 0755).
          cp deploy/apt-requirements.txt "$R/share/apt-requirements.txt"
          cp deploy/nexus-apply-deps     "$R/scripts/nexus-apply-deps"
          # Phase 9 (frozen-privilege refactor) — the SINGLE privileged OTA
          # applier the nexus-update sudoers rule grants; scripts/install.sh
          # copies it to /usr/local/sbin/nexus-apply-release (root:root 0755).
          cp deploy/nexus-apply-release  "$R/scripts/nexus-apply-release"
          # ADR-066 — the pinned remote-support diagnostic wrapper, the ONE
          # command the nexus-diag sudoers rule grants the `nexus-remote`
          # login; scripts/install.sh copies it to /usr/local/sbin/nexus-diag
          # and nexus-apply-release refreshes it from each release.
          cp deploy/nexus-diag           "$R/scripts/nexus-diag"
          chmod +x "$R/scripts/install.sh" "$R/scripts/uninstall.sh" \
                   "$R/scripts/enable-nics.sh" \
                   "$R/scripts/nexus-apply-deps" \
                   "$R/scripts/nexus-apply-release" \
                   "$R/scripts/nexus-diag"

          echo "$TAG" > "$R/VERSION"

          echo "--- staged tree ---"
          find "$R" -maxdepth 3 -type f | sort | head -40
          echo "--- size ---"
          du -sh "$R"

      - name: write MANIFEST.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, stat
          root = "stage"
          files = []
          for dp, _, fns in os.walk(root):
              for fn in fns:
                  if fn in ("MANIFEST.json",):
                      continue
                  p = os.path.join(dp, fn)
                  rel = os.path.relpath(p, root)
                  h = hashlib.sha256()
                  with open(p, "rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          h.update(chunk)
                  st = os.stat(p)
                  files.append({
                      "path":   rel,
                      "sha256": h.hexdigest(),
                      "size":   st.st_size,
                      "mode":   stat.S_IMODE(st.st_mode),
                  })
          files.sort(key=lambda e: e["path"])
          with open(os.path.join(root, "VERSION")) as f:
              version = f.read().strip()
          manifest = {
              "version":     version,
              "files":       files,
              "file_count":  len(files),
              "total_bytes": sum(e["size"] for e in files),
          }
          with open(os.path.join(root, "MANIFEST.json"), "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"manifest: {len(files)} files, "
                f"{manifest['total_bytes']/1e6:.1f} MB")
          PY

      # Ed25519 sign MANIFEST.json with the operator-held private key
      # stored in the `NEXUS_RELEASE_SIGNING_KEY` GH secret. The
      # matching public key is committed at
      # `scripts/lib/release-pubkey.pem`; `install.sh` verifies the
      # signature before installing. Skipped (loud warning, NOT a
      # failure) when the secret is unset so the very first release
      # cut before key onboarding still ships a tarball — `install.sh`
      # in that case warns about unsigned releases but proceeds unless
      # `NEXUS_REQUIRE_SIGNATURE=1` is exported by the operator.
      - name: sign MANIFEST.json (Ed25519)
        env:
          NEXUS_RELEASE_SIGNING_KEY: ${{ secrets.NEXUS_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NEXUS_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "::warning::NEXUS_RELEASE_SIGNING_KEY secret is unset; release tarball will be UNSIGNED. Configure the secret to enable signing."
            exit 0
          fi
          # Round-trip via a 0600 tempfile (`openssl pkeyutl -sign`
          # needs a file path, not stdin) and shred it after.
          umask 077
          keyfile="$(mktemp)"
          trap 'shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"' EXIT
          printf '%s\n' "$NEXUS_RELEASE_SIGNING_KEY" > "$keyfile"
          openssl pkeyutl -sign -inkey "$keyfile" -rawin \
            -in stage/MANIFEST.json -out stage/MANIFEST.json.sig
          # Sanity-check round trip with the committed pubkey so a
          # mismatched secret fails the workflow, not the operator.
          openssl pkeyutl -verify -pubin \
            -inkey scripts/lib/release-pubkey.pem -rawin \
            -in stage/MANIFEST.json -sigfile stage/MANIFEST.json.sig
          echo "MANIFEST.json signed and self-verified ($(wc -c < stage/MANIFEST.json.sig) bytes)"

      - name: package tarball
        id: pack
        run: |
          set -euo pipefail
          name="nexus-edge-${TAG}-linux-x86_64"
          # The published asset keeps the descriptive `name` above, but the
          # tarball's INTERNAL top-level directory MUST be the BARE version
          # (a single leading 'v' stripped, e.g. v0.1.7 -> 0.1.7). The OTA
          # self-updater (nexus-engine `cloud_update::install_release`)
          # extracts with `sudo tar -xzf … -C /opt/nexus/releases` (no
          # --strip-components) and then flips
          # `/opt/nexus/current -> releases/<version>` using the bare version
          # the cloud dispatches — which equals `NEXUS_BUILD_VERSION`
          # (build.rs strips the leading 'v'). If the top-level dir is
          # anything else (e.g. `nexus-edge-<tag>-linux-x86_64/`), the symlink
          # lands on a non-existent path and systemd fails the unit with
          # status=203/EXEC on the post-update restart. `install.sh` is
          # unaffected: it extracts with --strip-components=1 and derives the
          # release dir from the VERSION file, so the top-level name is moot.
          topdir="${TAG#v}"
          mv stage "$topdir"
          tar -czf "${name}.tar.gz" "$topdir"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          ls -lh "${name}.tar.gz" "${name}.tar.gz.sha256"
          # Hoist the in-tarball MANIFEST.json.sig (if signing ran)
          # out to a sibling asset so operators can grab it without
          # extracting the tarball first — same shape as .sha256.
          if [[ -f "${topdir}/MANIFEST.json.sig" ]]; then
            cp "${topdir}/MANIFEST.json.sig" "${name}.tar.gz.manifest.sig"
            echo "have_sig=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_sig=0" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: attach assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.pack.outputs.name }}
          HAVE_SIG: ${{ steps.pack.outputs.have_sig }}
        run: |
          set -euo pipefail
          # --clobber so a workflow re-run replaces existing assets
          # instead of failing. bootstrap.sh is what operators curl
          # for the one-liner install (see docs/INSTALL.md §6.1).
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${NAME}.tar.gz" \
            "${NAME}.tar.gz.sha256"
          if [[ "$HAVE_SIG" == "1" ]]; then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${NAME}.tar.gz.manifest.sig"
          fi
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "scripts/bootstrap.sh"
          # Standalone model files are NOT re-uploaded to the engine
          # release — they live on the matching `models-${PACK_VERSION}`
          # release (see "stage model pack" step above). External
          # tooling that needs an individual ONNX should pull from
          # `gh release download models-vN --pattern '...'`. This keeps
          # engine releases small and avoids per-cut 180 MB uploads.
          # The model files are still embedded in the tarball at
          # share/models/ for self-contained `install.sh` runs.

      # ----------------------------------------------------------------
      # Re-point the floating channel release (`stable` / `beta` / `dev`)
      # at this build. `bootstrap.sh` with no `--version` reads the
      # channel's VERSION asset, so this step is the moment a build
      # becomes what every new box installs.
      #
      # The pointer carries only VERSION + bootstrap.sh — the tarball
      # itself is downloaded from the version tag it names, so there is
      # no second copy of a ~400 MB asset to keep in sync.
      #
      # Deliberately NOT derived from GitHub's own "Latest" release:
      # that tracks the prerelease flag alone, so a full release routed
      # to `beta` by the dispatch input or NEXUS_CLOUD_RELEASE_CHANNEL
      # would still be served to new installs as stable.
      # ----------------------------------------------------------------
      - name: re-point channel pointer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG" > VERSION
          # `--prerelease` keeps the pointer off GitHub's "Latest" badge,
          # which must keep meaning "newest real version tag".
          gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$CHANNEL" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "$CHANNEL channel pointer" \
              --notes "Floating pointer maintained by .github/workflows/release.yml — not a release in its own right. Its VERSION asset names the build currently on the \`$CHANNEL\` channel, and scripts/bootstrap.sh reads it to resolve an install. To install an exact build instead, pass \`--version vX.Y.Z\`."
          gh release upload "$CHANNEL" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            VERSION \
            "scripts/bootstrap.sh"
          echo "channel '$CHANNEL' now points at $TAG"

  # -------------------------------------------------------------------------
  # publish-release-manifest — Phase 9 (OTA) cloud registration.
  #
  # After the signed tarball is attached to the GitHub Release, register it
  # with the cloud update-orchestrator so it becomes assignable to a channel
  # cohort. The orchestrator signs a canonical Ed25519 manifest over
  # {channel, version, artifact_url, artifact_sha256, min_wire_v, max_wire_v,
  # min_engine_version_to_apply} — the edge verifies that signature (against
  # the compiled-in NEXUS_RELEASE_SIGNING_PUBKEY_V1) plus the sha256 pin
  # before applying. This job only *reports* the artifact URL + digest; it
  # never uploads the tarball to the cloud (artifacts stay on GitHub
  # Releases — see docs decision "Artifact hosting: GitHub Releases ONLY").
  #
  # Auth: GitHub OIDC. The runner mints a short-lived id-token and presents
  # it as a Bearer to the cloud releases ingress (the api-gateway, which
  # validates the OIDC `sub` against its release-publisher allow-list and
  # forwards to the orchestrator's internal POST /v1/releases with an
  # X-Release-Publisher header). No long-lived secret is stored in the repo.
  #
  # Inert until configured: the job is skipped unless the repo/environment
  # variable NEXUS_CLOUD_RELEASES_URL is set, so cutting a release before
  # the cloud control plane is provisioned is a harmless no-op.
  # -------------------------------------------------------------------------
  publish-release-manifest:
    name: register release with cloud orchestrator
    needs: [tarball, resolve-channel]
    runs-on: ubuntu-22.04
    # Only run when the cloud endpoint is configured. Skipping here keeps
    # tarball-only releases (pre-cloud, or airgapped forks) green.
    if: ${{ vars.NEXUS_CLOUD_RELEASES_URL != '' }}
    # Bind the job to a GitHub Environment so the OIDC token's `sub` is the
    # STABLE `repo:<owner>/<repo>:environment:cloud-release-publish` instead
    # of the per-tag `...:ref:refs/tags/<tag>`. The cloud orchestrator's
    # RELEASE_PUBLISHER_SUBJECTS allow-list pins this exact subject, so it
    # must not vary per release. The environment carries no secrets and no
    # required reviewers — it exists purely to fix the OIDC subject.
    environment: cloud-release-publish
    permissions:
      # id-token: mint the GitHub OIDC token presented to the cloud.
      # contents: read the .sha256 sidecar asset back off the release.
      id-token: write
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      RELEASES_URL: ${{ vars.NEXUS_CLOUD_RELEASES_URL }}
      # OIDC audience the cloud releases ingress expects. Override via the
      # NEXUS_CLOUD_RELEASES_AUD variable if the api-gateway is configured
      # with a different `aud`.
      RELEASES_AUD: ${{ vars.NEXUS_CLOUD_RELEASES_AUD || 'api://nexus-cloud/releases' }}
      # Resolved once in `resolve-channel` so the channel this build is
      # registered under and the channel pointer new installs read cannot
      # disagree.
      CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    steps:
      - name: post release manifest to cloud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          name="nexus-edge-${TAG}-linux-x86_64"

          # version: strip a single leading 'v' so the cloud stores plain
          # semver (v0.6.0 -> 0.6.0). Everything after is passed verbatim.
          version="${TAG#v}"

          # artifact_url: the public GitHub Release asset download URL for
          # the linux-x86_64 tarball (attached by the `tarball` job).
          artifact_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}.tar.gz"

          # artifact_sha256: pull the .sha256 sidecar back off the release
          # and take the digest field (sha256sum format: "<hex>  <name>").
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${name}.tar.gz.sha256" \
            --dir /tmp \
            --clobber
          artifact_sha256="$(awk '{print $1; exit}' "/tmp/${name}.tar.gz.sha256")"
          if [[ ! "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::could not parse a 64-hex sha256 from ${name}.tar.gz.sha256"
            exit 1
          fi

          # Mint a GitHub OIDC token scoped to the cloud releases audience.
          oidc="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RELEASES_AUD}" \
            | jq -r '.value')"
          if [[ -z "$oidc" || "$oidc" == "null" ]]; then
            echo "::error::failed to mint GitHub OIDC token"
            exit 1
          fi

          body="$(jq -nc \
            --arg channel "$CHANNEL" \
            --arg version "$version" \
            --arg url "$artifact_url" \
            --arg sha "$artifact_sha256" \
            '{channel: $channel, version: $version, artifact_url: $url, artifact_sha256: $sha, min_wire_v: 1, max_wire_v: 1}')"

          echo "Registering ${CHANNEL}/${version} -> ${artifact_url}"

          # POST and capture status + body separately so a non-2xx fails the
          # job with a readable message (and never dumps the OIDC token).
          http_code="$(curl -sS -o /tmp/cloud-resp.json -w '%{http_code}' \
            -X POST "$RELEASES_URL" \
            -H "Authorization: Bearer ${oidc}" \
            -H 'Content-Type: application/json' \
            --data "$body")"

          if [[ "$http_code" == "200" || "$http_code" == "201" ]]; then
            echo "cloud accepted release manifest (HTTP ${http_code})"
            jq -r '"  id=\(.id // "?") signing_key_id=\(.signing_key_id // "?")"' \
              /tmp/cloud-resp.json 2>/dev/null || true
          else
            echo "::error::cloud rejected release manifest (HTTP ${http_code})"
            head -c 2000 /tmp/cloud-resp.json || true
            exit 1
          fi
