name: Build request
description: >-
  Work that has no spec yet. It goes to design first, not to a builder: run
  `brainstorming`, then `writing-plans`, then open a SPEC PR.
title: "Build request: "
labels: ["factory:needs-spec"]
body:
  - type: markdown
    attributes:
      value: |
        This issue does not start a build. Next steps:

        1. Run `brainstorming` to produce the design.
        2. Run `writing-plans` to produce the plan.
        3. Open a SPEC PR that cites both in `source:` and sets `factory:` and `repo:`.
           Merging it with `status: Approved` opens the work-order issue.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, and for whom?
    validations:
      required: true
  - type: dropdown
    id: repo
    attributes:
      label: Repo
      options: [cloud, edge, website, cross]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size guess
      options: [small, medium, large, not sure]
    validations:
      required: true
