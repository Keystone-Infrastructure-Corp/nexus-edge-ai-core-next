# Canonical copy: nexus-home/ci/.github/workflows/claude.yml. Edit it there;
# each repo carries a verbatim copy, and `nexus-setup --check` reports drift.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled, opened, ready_for_review]

permissions: {}

jobs:
  claude:
    # The action itself also rejects actors without write access and bots. Mentions are
    # also gated here on the commenter's association, so outsiders on a public repo never
    # start the job or mint the App token, and PR review mentions never run fork code.
    # `@claude review` belongs to Claude Code Review (its own GitHub App), so it is
    # skipped here; otherwise one comment would start two Claude runs. A same-repo PR a
    # person opens ready, or marks ready, gets a requesting-code-review run.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        !contains(github.event.review.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'factory:medium') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        github.event.label.name == 'factory:fix-ci' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft && github.event.sender.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Label-triggered builds: 180 min, one group per issue or PR. @claude mentions: 60 min,
    # one group per run. A shared group silently cancelled pending builds, so the cost
    # guard is timeout-minutes only.
    timeout-minutes: ${{ github.event.action == 'labeled' && 180 || 60 }}
    concurrency:
      group: ${{ github.event.action == 'labeled' && format('claude-build-{0}', github.event.issue.number || github.event.pull_request.number) || format('claude-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action's Claude GitHub App token exchange
      actions: read # read CI results and logs
    steps:
      # An issue_comment payload has no head repo, so the job `if:` cannot tell a fork PR
      # apart. Refuse it before any checkout or secret: the action would check out the
      # fork's branch, and with it the fork's AGENTS.md and .claude/settings.json hooks.
      - name: Refuse pull requests from forks
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fork=$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != false ]; then
            echo "::error::@claude does not run on pull requests from forks (got '$fork')"
            exit 1
          fi

      - name: Write the prompt
        id: prompt
        if: github.event.action == 'labeled' || github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            # Read labels live: the event payload can predate labels added in the same call.
            spec=$(gh issue view "$ISSUE" --repo "$REPO" --json labels \
              --jq '[.labels[].name | select(startswith("spec:")) | sub("^spec:"; "")] | first // ""')
            # The label text goes into the prompt, so accept only the SPEC-NNN shape.
            if ! printf '%s' "$spec" | grep -Eq '^SPEC-[0-9]+$'; then
              echo "::error::factory:medium needs a spec:SPEC-NNN label (found '${spec}')"
              exit 1
            fi
            text="Work order #$ISSUE in $REPO. Run implement-loop for $spec: read AGENTS.md, then .agents/skills/implement-loop/SKILL.md, and follow it on the vault record $spec. Work on a new branch. When the loop passes, push it and open a draft pull request whose body starts with \"Closes #$ISSUE\" and carries the ledger. If you stop short, comment on #$ISSUE with what is left and why."
          elif [ "$ACTION" = labeled ]; then
            text="Pull request #$PR in $REPO has failing checks. Fix them with implement-loop: read AGENTS.md, then .agents/skills/implement-loop/SKILL.md. The task is to make the failing checks pass; read them with \`gh pr checks $PR\` and \`gh run view <run-id> --log-failed\`. Base the loop's worktree on origin/$BRANCH, not origin/main, and when the loop passes push its commits to $BRANCH. Then comment on #$PR with the cause, the fix, what you ran and the ledger."
          else
            text="Review pull request #$PR in $REPO with the requesting-code-review skill. HEAD_SHA is $HEAD_SHA and BASE_SHA is \`git merge-base origin/$BASE $HEAD_SHA\`. The requirements are the PR description, plus the issue it closes and the spec that issue names, if any. Dispatch the skill's fresh reviewer on the strongest tier with REVIEW.md as its checklist; it reports only REVIEW.md's P0 and P1 findings, each with file:line. Post one comment with \`gh pr comment $PR\`: the findings, or \"No P0 or P1 findings.\", and what the reviewer could not check. Do not edit files or push commits."
          fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      # The action works in $GITHUB_WORKSPACE, so the repo is checked out there, at the
      # event's default ref: no step checks out a PR head. For a mention on a PR the action
      # checks out the PR branch itself (forks are refused above); fix-ci's loop bases its
      # worktree on origin/<branch>, and the review reads the PR's commits from history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nexus-home

      # checkout only writes inside the workspace; move it beside the repo so
      # `../nexus-home` resolves as it does locally.
      # Sparse: the plugin needs only these; reference/ and .agents/memory/ stay private.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/nexus-home
          token: ${{ steps.app.outputs.token }}
          path: .nexus-home
          persist-credentials: false
          sparse-checkout: |
            .claude-plugin
            .agents/skills
            hooks
            bin
      - run: mv .nexus-home ../nexus-home

      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude Code prefers an API key over the OAuth token when both are set,
          # so the key is passed only when the OAuth secret is empty.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: ${{ github.workspace }}/../nexus-home
          plugins: nexus@nexus-home
          # The action mints its own token; the job's `actions: read` does not reach it,
          # and factory:fix-ci needs it to read failed-run logs.
          additional_permissions: |
            actions: read
          # An empty prompt keeps @claude mentions in interactive (tag) mode.
          prompt: ${{ steps.prompt.outputs.text }}
          # Intake labels issues as the factory App, and the action rejects bots not named
          # here. If the App's slug differs, change nexus-factory.
          allowed_bots: ${{ github.event.action == 'labeled' && 'nexus-factory' || '' }}
          # Setting allowed_bots turns off the action's default auto permission mode. The
          # appended rule reaches @claude mentions, which have no prompt of their own.
          claude_args: >-
            ${{ github.event.action == 'labeled' && '--permission-mode auto' || '' }}
            --append-system-prompt "Every code change goes through the implement-loop skill:
            read AGENTS.md, then .agents/skills/implement-loop/SKILL.md. When the loop passes,
            push its commits: on a pull request, base the loop on the PR branch and push back
            to it; for an issue, push a new branch and open a draft pull request. Every review
            goes through the requesting-code-review skill."
