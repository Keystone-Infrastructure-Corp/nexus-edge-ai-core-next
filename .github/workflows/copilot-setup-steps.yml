# Prepares the Copilot cloud agent's runner. The agent's runs see
# FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY only as Agents secrets (repo or
# org Settings > Secrets and variables > Agents), never as Actions or
# environment secrets. Validation runs (pull_request, workflow_dispatch) see
# Actions secrets instead. The nexus-home steps skip when the kind a run sees
# is not set.
# GitHub allows only these job keys here (others are ignored, so the secrets
# flag is a step output, not job env): steps, permissions, runs-on, services,
# snapshot, timeout-minutes (59 or less).
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: if [ -f package-lock.json ]; then npm ci; fi
        working-directory: ui

      - name: Check for the factory App secrets
        id: secrets
        env:
          HAS_APP: ${{ secrets.FACTORY_APP_ID != '' && secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: echo "has_app=$HAS_APP" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.secrets.outputs.has_app == 'true'
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nexus-home
      # checkout only writes inside the workspace; move it beside the repo so
      # `../nexus-home` resolves as it does locally.
      # Sparse: the skills need only these; reference/ and .agents/memory/ stay private.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.has_app == 'true'
        with:
          repository: ${{ github.repository_owner }}/nexus-home
          token: ${{ steps.app.outputs.token }}
          path: .nexus-home
          persist-credentials: false
          sparse-checkout: |
            .claude-plugin
            .agents/skills
            hooks
            bin
      - if: steps.secrets.outputs.has_app == 'true'
        run: mv .nexus-home ../nexus-home

      - name: Link the shared skills into .agents/skills, uncommitted
        if: steps.secrets.outputs.has_app == 'true'
        run: |
          mkdir -p .agents/skills
          for src in ../nexus-home/.agents/skills/*/; do
            name=$(basename "$src")
            # The core is read by path from the repo's own extension; a repo skill wins a clash.
            [ "$name" = implement-loop-core ] && continue
            [ -e ".agents/skills/$name" ] && continue
            ln -s "../../../nexus-home/.agents/skills/$name" ".agents/skills/$name"
            echo "/.agents/skills/$name" >> .git/info/exclude
          done
