# nexus.example.toml — fully annotated reference.
#
# This is a human-readable REFERENCE only. On a real box the live
# /etc/nexus/nexus.toml is GENERATED from the detected hardware by
# `nexus-probe emit-config` (run automatically by scripts/install.sh) —
# the right ep_priority, decode mode, worker/thread sizing, and model
# preset are chosen per box. The capability matrix (Intel iGPU / NPU /
# AMD Vulkan / ROCm / Hailo / NVIDIA / CPU) is documented in
# [docs/HARDWARE_MATRIX.md](../docs/HARDWARE_MATRIX.md).
#
# NOTE: this reference file leaves `ep_priority = ["openvino", "cpu"]`
# below as a neutral default so the example boots on an Intel dev box.
# A generated Hailo config pins `["hailo", "cpu"]`; an AMD Vulkan box
# pins `["vulkan", "cpu"]` (the AMD Radeon 680M iGPU is NOT
# OpenVINO-compatible). To pin a profile by hand use
# `install.sh --force-profile <name>`.
#
# Every backend-selectable layer exposes a `backend` knob. Everything else
# under that section configures the chosen backend.

[runtime]
# 0 = use available_parallelism().
worker_threads = 0
blocking_threads = 8
# M3.1 — where the engine writes uploaded YOLOE visual-prompt
# reference images. Each upload to POST /v1/admin/visual-prompts
# is content-addressed (SHA256 over the bytes) and stored as
# `<sha>.<ext>`; the embedding lives in the database. Default
# `/var/lib/nexus/visual_prompts`. Created on demand. Operators
# who put `clips_dir` on a separate disk usually want this on
# the same disk (uploads are small but admin-only writes).
# visual_prompts_dir = "/var/lib/nexus/visual_prompts"

[runtime.decode]
# Selects the RTSP decode + post-process backend for the analysis
# (detector) frame tap. Hardware decode offloads H.264/H.265 from
# the CPU onto the GPU video block, which is the difference between
# a CPU-bound and a comfortable box on multi-camera installs.
#   "auto"     — (default) use VA-API hardware decode
#                (vah264dec/vah265dec ! vapostproc) when the GPU +
#                GStreamer VA plugin are present, else NVIDIA NVDEC
#                (nvh264dec/nvh265dec) when the nvcodec plugin is
#                present, otherwise fall back to software
#                (avdec_h264/avdec_h265). Always safe.
#   "va"       — force VA-API; still fails open to software if the
#                VA plugin/driver is missing (logged as a warning).
#   "msdk"     — force Intel Media SDK (msdkh264dec ! msdkvpp); falls
#                back to VA then software. Only for boxes where MSDK
#                outperforms the libva path.
#   "nvdec"    — force NVIDIA NVDEC (nvh264dec/nvh265dec, from the
#                nvcodec plugin); falls back to software if the
#                proprietary driver or plugin is missing.
#   "software" — force CPU decode. Use to rule out a flaky GPU driver.
# Omit this whole section to get "auto" (zero-migration upgrade).
mode = "auto"

[runtime.clips]
# Which recorder backend writes the mp4 files.
#   "gstreamer" — real H.264-passthrough fragmented mp4 via the shared
#                 RTSP session (detector + recorder share one connection
#                 per camera via a `tee`). REQUIRES the engine to be
#                 built with `--features gstreamer`. This is what every
#                 production deployment wants.
#   "stub"      — writes empty placeholder files. Default fallback so
#                 the engine can boot in CI / on a dev box without
#                 GStreamer. If you see 0-byte clip files in
#                 `clips_dir` after a motion event, the recorder is
#                 stub-mode — flip this to "gstreamer" and restart.
recorder = "gstreamer"
# Where the recorder writes mp4 files. Created on demand.
clips_dir = "/var/lib/nexus/clips"
# Daily retention sweeper deletes clips older than this. The watermark
# sampler can evict sooner if disk pressure rises.
motion_clips_retention_days = 30
# Cap on `track.updated` motion-event row writes per active track per
# second. `track.born` and `track.died` are always emitted.
motion_events_sample_hz = 1.0
# Below this percentage of free space on the clips_dir filesystem, the
# watermark sampler starts evicting one round per check.
low_watermark_pct = 15
# Below this percentage the recorder refuses to open new clips and
# eviction runs hard until free space recovers to low + 5pct.
panic_watermark_pct = 5
# How often the watermark sampler runs.
watermark_sample_interval_secs = 30
# Hard ceiling on a single clip's on-disk size, in bytes. A healthy
# 30-60 s 1080p clip is a few MB; this only trips on a camera emitting
# a corrupt H.264 stream whose byte-rate explodes (seen in the field:
# 640x360 clips ballooning to ~2 GiB). The recorder stats the in-flight
# file periodically and rotates when it crosses this size, and the cold
# replicator derives a pre-emptive upload-quarantine ceiling (2x) from
# it so a runaway clip never head-of-line-blocks the upload queue.
# Default 256 MiB.
max_clip_bytes = 268435456
# Guarantee every alert/event has an underlying full-resolution motion
# clip. The cheap motion gate + tracker are tuned for sustained
# movement, so a small / distant / briefly moving object can trip a
# rule (fire an alert) without the tracker ever declaring motion —
# leaving the event with no surrounding native-resolution video. When
# true, an alert firing on a frame with no clip open force-opens a
# native-resolution motion clip (same as the motion path, incl.
# pre-roll) and keeps it open through post_roll_secs. This is the
# full-res, longer-capture motion clip — NOT the reduced-resolution
# burned-in alert clip (see [runtime.clips.alert_clips]). Default true.
record_motion_clip_on_alert = true

[server]
api_bind = "0.0.0.0:8089"
# Optional second listener — same router, same auth — so operators
# can reach the admin console at `http://<host>/` without typing
# the engine port. Comment out to bind only `api_bind`. Binding
# port <1024 needs `CAP_NET_BIND_SERVICE` (Docker has it; the
# systemd unit in docs/INSTALL.md §7.7 sets it).
ui_bind = "0.0.0.0:80"
# In the container the UI is at /usr/share/nexus/ui. Locally use ui/dist.
ui_root = "/usr/share/nexus/ui"
# M-HTTPS Phase 1 — in-process TLS listener. When `https_bind` is
# set, the engine binds the third listener on :443 and (with the
# default `redirect_http_to_https = true`) turns `ui_bind` into a
# 308-redirect shim. Run `nexus-engine tls init` once to mint the
# self-signed leaf at the paths below; the installer does this
# automatically. Leave all three lines commented to opt out.
# https_bind = "0.0.0.0:443"
# tls_cert_path = "/etc/nexus/tls/cert.pem"
# tls_key_path  = "/etc/nexus/tls/key.pem"
# Enable HSTS. v0.1.36 onward the engine gates this on cert
# source: the `Strict-Transport-Security` header is emitted ONLY
# when the leaf is the cloud-issued cert minted by enrollment-svc
# (M-HTTPS Phase 3). Self-signed bootstrap leaves never advertise
# HSTS, so this value is safe to set even before the appliance is
# enrolled with the cloud.
# hsts_max_age_seconds = 31536000

[store]
url = "sqlite:///var/lib/nexus/nexus.db?mode=rwc"
seed_from_config = true
duckdb_attach = false
duckdb_path = "/var/lib/nexus/analytics.duckdb"

[telemetry]
log_level = "info,nexus=debug"
json_logs = false
# [telemetry.otlp]
# endpoint = "http://otel-collector:4317"
# service_name = "nexus-engine"
# sample_ratio = 0.05

[auth]
# Customer-facing default since M6. First boot creates a single
# `admin` user with a one-time password printed once at WARN;
# sign in at `/login` and set a real password. The HS256 session-
# signing secret auto-provisions to `<runtime.state_dir>/admin-secret`
# (mode 0600). See `docs/ARCHITECTURE.md §11` for the full identity
# model and `docs/INSTALL.md §8.3` for the alternatives below.
mode = "local" # local | oidc | hybrid
# admin_secret_path = "/var/lib/nexus/state/admin-secret"  # pin to skip autoprovision
#
# --- Identity architecture (read before changing `mode`) ----------
# The shipping product authenticates end users at the cloud-console
# (nexus-cloud-console repo) — one Entra External ID app, one secret,
# held in YOUR Azure Key Vault. Edge cores accept short-lived
# `actor_token` JWTs minted by the cloud-console and forwarded over
# the mTLS tunnel. See `docs/ARCHITECTURE.md §11`.
#
# That means edge boxes do NOT need per-deployment OIDC config:
#
#   * `mode = "local"`  — default for a fresh install. Boots with a
#                         one-time admin OTP printed at WARN; admin
#                         sets a password on first login. This is
#                         ALSO the offline escape hatch when the
#                         cloud-console tunnel is unreachable.
#   * `mode = "oidc"`   — EXPERT MODE for the rare on-prem deployment
#                         that wants to point a single edge box at a
#                         site-local Authentik / Keycloak / AD FS.
#                         Not the customer-facing default; ships
#                         unconfigured. See `docs/M6_IDENTITY.md`.
#   * `mode = "hybrid"` — both local + OIDC; OIDC for normal sign-in,
#                         a single local `breakglass` admin for IdP
#                         outages. Same expert-mode caveat applies.
#
# Below: the OIDC block stays as a reference template for the expert
# path. It is intentionally commented out — leaving `[auth.oidc]`
# defined while `mode != "oidc" | "hybrid"` is harmless but pointless.
#
# [auth.oidc]
# issuer        = "https://auth.example.com/application/o/nexus"
# audience      = "nexus-engine"
# client_id     = "nexus-engine"
# display_name  = "Corporate SSO"
# # `redirect_uri` is OPTIONAL for Authentik / Keycloak / Okta / Google
# # (they accept the relative path `/api/v1/auth/oidc/callback`).
# # REQUIRED for Microsoft Entra ID, which mandates a full HTTPS URL.
# # redirect_uri = "https://nexus.example.com/api/v1/auth/oidc/callback"
# # Confidential client? Wire the secret via ONE of these (mutually
# # exclusive). See `docs/M6_IDENTITY.md` for k8s / Docker / systemd
# # patterns that avoid hand-installing the secret file on every box.
# # client_secret_file = "/run/secrets/oidc"
# # client_secret_env  = "NEXUS_OIDC_CLIENT_SECRET"
# scopes        = ["openid", "profile", "email", "groups"]
#
# [auth.oidc.role_map]
# admin    = ["nexus-admins"]
# operator = ["nexus-operators"]
# viewer   = ["nexus-viewers"]

# -----------------------------------------------------------------
# Inference — the trait + pool + scale-factor pattern lives here.
# A generated config sizes `workers`/`ep_priority` per detected box; the
# values below are neutral reference defaults.
# -----------------------------------------------------------------
[inference]
backend = "pool"          # in_process | pool
workers = 2
restart_backoff_ms = 2000
fail_soft = true
# Default order for Intel-based boxes (iGPU/dGPU). An NVIDIA box leads with
# tensorrt; an Intel NPU box inserts "npu" between openvino and cpu. coreml is dev-only.
# `"hailo"` is recognized by `build_detector_for_yolo` (M_HAILO_EP): if it
# appears in this list AND a `yolo26n.hef` artifact exists in the model
# pack, the Hailo-8 path is taken via nexus-hailo-backend / libhailort.so.
# Hailo is not an ORT EP — it's a parallel runtime. Listing it here is
# safe on non-Hailo boxes (the binary falls through to the next EP).
ep_priority = ["openvino", "cpu"]

[inference.model]
# yolo (default, closed-vocab; ships per-size: yolo26n_640.onnx / _960.onnx / _1280.onnx,
# plus yolo26n.hef for Hailo-8 boxes) | open_vocab | classifier_ensemble | mock
kind = "yolo"
# Pack preset — "320" / "640" / "1280" from models-manifest.json.
#   cpu profile → 320 (lowest latency)
#   all other profiles → 640 (default operating point)
#   regional refinement → 1280 (per-frame second pass on uncertain regions)
preset = "640"
# pack_path = "/var/lib/nexus/models/yolo26n"
input_width = 640
input_height = 640
score_threshold = 0.30

# -----------------------------------------------------------------
# Tracker
# -----------------------------------------------------------------
[tracker]
backend = "bytetrack" # iou_naive | bytetrack
track_ttl_ms = 2000
iou_threshold = 0.30

# Phase 8.1 annotator tuning. Defaults preserve vehicle-only anchors and
# disable tool proximity. Set these to drive the wedge break-in rules:
# [tracker.annotator]
# static_anchor_classes = ["ladder", "wheelbarrow", "scissor lift"]
# tool_proximity_labels = ["crowbar", "hammer", "bolt cutter"]
# proximity_radius_box_multiplier = 1.5
# tool_proximity_radius_box_multiplier = 1.0

# -----------------------------------------------------------------
# Rules — CEL.
# -----------------------------------------------------------------
[rules]
backend = "cel" # cel

[[rules.inline]]
id = "person_in_zone"
name = "Person seen"
when = "object.label == 'person' && object.confidence > 0.4"
severity = "medium"
min_track_age_ms = 500
consecutive_frames = 2
cooldown_ms = 30000
enabled = true

# --- Phase 8 wedge starter rules: candidates the cloud VLM verifies ---
# These match the new annotator attributes (motion.near_static_vehicle_*,
# motion.tool_in_proximity_*, motion.removed_anchor_ids). They only fire
# usefully when [tracker.annotator] has static_anchor_classes and
# tool_proximity_labels set, and the camera runs parking_lot_mode = true.
# [[rules.inline]]
# id = "suspected_vehicle_break_in"
# name = "Person with a tool lingering at a parked vehicle"
# when = "object.label == 'person' && object.attributes['motion.near_static_vehicle_seconds'] >= 15 && object.attributes['motion.tool_in_proximity_label'] != ''"
# severity = "critical"
# min_track_age_ms = 1000
# consecutive_frames = 3
# cooldown_ms = 60000
# enabled = true
#
# [[rules.inline]]
# id = "equipment_removed_from_zone"
# name = "Person carrying away a tracked anchor"
# when = "object.label == 'person' && size(object.attributes['motion.removed_anchor_ids']) > 0 && object.attributes['motion.carrying_anchor_label'] != ''"
# severity = "high"
# cooldown_ms = 60000
# enabled = true

# -----------------------------------------------------------------
# Bus
# -----------------------------------------------------------------
[bus]
backend = "broadcast" # broadcast | nats
capacity = 1024
# nats_url = "nats://nats:4222"

# -----------------------------------------------------------------
# Re-identification (Phase 5.6 — wedge identity graph)
# -----------------------------------------------------------------
# Disabled by default. When enabled the per-camera supervisor emits
# an `entity_sighting` envelope per stable track (first sighting +
# every `emit_interval_s` thereafter) carrying an appearance
# embedding. Cloud-side allowlist accepts ONLY `dinov2-s-v1` or
# `osnet-x1.0-v1`; with no `model_path` (or no `ort` cargo feature)
# the engine falls back to a `MockExtractor` and SKIPS the cloud
# publish entirely (logged at debug).
#
# [reid]
# enabled = false
# # ONNX path. Ship via the model-pack release (models-v2+) into
# # /opt/nexus/current/models/dinov2_s_224.onnx. Omit to force
# # mock-only / disable cloud submissions.
# # model_path = "models/dinov2_s_224.onnx"
# model_id = "dinov2-s-v1"
# dim = 384
# emit_interval_s = 5
# min_track_age_frames = 5
# # Supervisor-frame bbox-size floor for the worker. Snapshots
# # below this are dropped before the ORT call AND before reaching
# # the cloud — DINOv2-S embeddings on heavily-upsampled tiny
# # crops are noise and poison the cross-camera linker. Defaults
# # 40×96; bump higher (e.g. 64×128) if false matches dominate the
# # graph. `0` disables either floor.
# min_crop_w_px = 40
# min_crop_h_px = 96
# # ep_priority = ["coreml", "cpu"]   # macOS dev
# # ep_priority = ["openvino", "cpu"] # Intel iGPU/NPU
# # ep_priority = ["cuda", "cpu"]     # NVIDIA

# -----------------------------------------------------------------
# Cameras (DB is the source of truth; this seeds an empty DB)
# -----------------------------------------------------------------
[[cameras]]
id = 1
name = "Front Door"
url = "rtsp://demo:demo@front-door.local:554/Streaming/Channels/101"
enabled = true
prompts = ["person", "package", "vehicle"]
max_fps = 10

[[cameras.zones]]
id = "porch"
name = "Porch"
polygon = [[0.1, 0.5], [0.9, 0.5], [0.9, 1.0], [0.1, 1.0]]
kind = "inclusion"
