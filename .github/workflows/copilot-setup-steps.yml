# Prepares the runner Copilot code review uses: by default it reuses this file
# (a .github/workflows/copilot-code-review.yml would override it). The Copilot cloud
# agent does not build in this repo (cloud ADR-098), so nothing here reaches nexus-home
# or needs a secret. Validation runs on pull_request and workflow_dispatch.
# GitHub allows only these job keys here: steps, permissions, runs-on, services,
# snapshot, timeout-minutes (59 or less).
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: if [ -f package-lock.json ]; then npm ci; fi
        working-directory: ui
