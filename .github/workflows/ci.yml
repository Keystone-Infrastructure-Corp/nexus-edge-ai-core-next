name: ci

# Verifies every push and PR. The whole point of M0 is that this workflow
# turns red the moment we type-drift the workspace, the UI, or the
# Dockerfile — without needing rustup on anyone's mac.
#
# Default features are empty everywhere on purpose (gstreamer + ort are
# optional cargo features) so the standard ubuntu-latest runner does real
# work without dragging in system libs. The `system-libs` job below opts
# the heavy features in on a runner that does have them installed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` is load-bearing: the `system-libs` job below opts in via a
    # `system-libs` PR label. The default types (opened/synchronize/reopened)
    # do NOT include `labeled`, so applying the label produced no new run and
    # the job stayed `skipping` until someone happened to push again — i.e. the
    # documented opt-in silently did nothing on the PR that needed it.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel superseded runs on the same ref. Keeps the queue honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Note: -D warnings is applied per-step on `cargo clippy`, not globally,
  # so dependency-side warnings on a future rustc don't break our CI.

jobs:
  # ---------------------------------------------------------------------
  # Blocking formatting check. Required since 2026-05-13 once a local
  # rustfmt sweep was applied (commit on the same push as Cargo.lock).
  # ---------------------------------------------------------------------
  fmt:
    name: rust (fmt --check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: install rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------
  # Rust workspace (default features only — no GStreamer, no ORT system libs).
  # ---------------------------------------------------------------------
  rust:
    name: rust (check / clippy / test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # `rustup show active-toolchain || rustup toolchain install` is the
      # canonical way to make rustup honor rust-toolchain.toml (which pins
      # the version + components rustfmt/clippy). The dtolnay action with
      # `@stable` would override the pin, which we don't want.
      - name: install rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo check (workspace, all targets)
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --locked --workspace --no-fail-fast

      # `session_tuning` is behind `#![cfg(feature = "ort")]`, so the run
      # above cannot see it. These tests exercise the EP demotion policy
      # only — no session is ever created — and `ort` is a `load-dynamic`
      # dependency, so they link and pass with no ONNX Runtime present.
      # That keeps them on every PR instead of only the label-gated
      # `system-libs` job below.
      - name: cargo test (EP demotion policy, ort feature)
        run: cargo test --locked -p nexus-inference --features ort,ep-cpu --lib session_tuning

      # `imp.rs`, `ffi.rs` and the `nexus-hailo-probe` binary sit behind
      # `all(target_os = "linux", feature = "linked")`, so the workspace
      # check above compiles `stub.rs` in their place and has never
      # type-checked the real implementation. `linked` is `dlopen`-based
      # (no build.rs, no link attributes, no build-time HailoRT), so it
      # compiles on a clean runner with zero Hailo artifacts present.
      # Without this step the release job is the FIRST compile of that
      # code, and a failure there blocks a tag cut instead of a PR.
      - name: cargo clippy (hailo linked path)
        run: cargo clippy --locked -p nexus-hailo-backend --features linked --all-targets -- -D warnings

      # nexus-inference's `ort`- and `ep-*`-gated code is invisible to the
      # workspace clippy above, which runs default features, and four lints
      # sat in it unseen (SPEC-075). This is the release build's EP set. It
      # needs nothing installed: `ort` is `load-dynamic`, whose build script
      # neither downloads nor links ONNX Runtime, and `ep-hailo` pulls the
      # `dlopen`-based `linked` backend linted in the step above.
      - name: cargo clippy (nexus-inference, release EP features)
        run: cargo clippy --locked -p nexus-inference --features ort,ep-cpu,ep-openvino,ep-cuda,ep-tensorrt,ep-hailo,ep-rocm,ep-vulkan --all-targets -- -D warnings

      # Enforces AGENTS.md rule 2: an allowlisted `license` and a
      # non-disqualifying `weights_dataset_license` on every manifest entry,
      # no face-recognition names, and no file in `models/` the manifest does
      # not name. See [xtask/README.md](../../xtask/README.md). Every rule
      # except a missing field already fails without `--strict`; a missing
      # field only warns until the `yolo_world_v2_s` and `yoloe26_s` entries
      # carry licence fields backed by verified artifact provenance, and
      # `--strict` is used once they do. Here `models/` holds only the
      # manifest; `system-libs` repeats the check against the downloaded
      # weights.
      - name: cargo xtask check-models
        run: cargo xtask check-models

      - name: cargo xtask check-span-cardinality
        run: cargo xtask check-span-cardinality

  # ---------------------------------------------------------------------
  # ts-rs roundtrip — running `cargo test -p nexus-types --features ts`
  # regenerates one `*.ts` file per `#[derive(TS)]` type into
  # `ui/src/api/types/`. `git diff --exit-code` then fails if Rust-side
  # schema changes weren't accompanied by a re-committed binding. The
  # hand-curated `ui/src/api/types.ts` is the UI's import surface and is
  # NOT generated — it's hand-mirrored once per intentional shape change.
  # ---------------------------------------------------------------------
  rust-ts-feature:
    name: rust (nexus-types ts feature)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: install rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: cargo test -p nexus-types --features ts (regenerates ui/src/api/types/)
        run: cargo test --locked -p nexus-types --features ts
      - name: verify no drift in generated bindings
        run: |
          # intent-to-add first: `git diff` alone cannot see untracked files, so a
          # brand-new binding for a newly-derived type slipped through this gate.
          git add --intent-to-add -- ui/src/api/types/
          if ! git diff --exit-code -- ui/src/api/types/; then
            echo "::error::ts-rs bindings drifted from Rust derives in nexus-types."
            echo "Run: cargo test -p nexus-types --features ts && git add ui/src/api/types/"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # UI — lint, vitest, TypeScript typecheck + production build. Uploads dist/ so the
  # docker job (and humans clicking "Download artifact") can grab it.
  # ---------------------------------------------------------------------
  ui:
    name: ui (lint / test / typecheck / build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint

      - name: unit tests (vitest)
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: upload ui dist
        uses: actions/upload-artifact@v5
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # UI end-to-end — the Playwright suite under ui/e2e/. Always on: BUG-264
  # was three specs rotting on main because no job ran them. globalSetup
  # spawns <repo>/target/debug/nexus-engine (hard-coded path, so the default
  # target dir is required here) on E2E_PORT and serves ui/dist from it, so
  # both must be built first. `test-injection` is the engine's test-only
  # fault/clock injection surface the specs drive. No system libs: default
  # features, same as the `rust` job.
  #
  # `--reporter` on the command line overrides the config's CI-only `github`
  # reporter so an HTML report exists to upload; `github` stays for inline
  # annotations.
  # ---------------------------------------------------------------------
  ui-e2e:
    name: ui (playwright e2e)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: install rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-e2e

      - name: build nexus-engine (test-injection)
        run: cargo build --locked -p nexus-engine --features test-injection

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: build ui/dist
        working-directory: ui
        run: npm run build

      - name: install chromium (with system deps)
        working-directory: ui
        run: npm run e2e:install

      - name: playwright e2e
        working-directory: ui
        run: npm run e2e -- --reporter=github,html

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # Optional: build with the heavy `gstreamer` + `ort` features enabled.
  # Runs on every push to main and on PRs labeled `system-libs`. Failures
  # block release but not normal PR iteration.
  #
  # Also the only job that runs the model-backed inference smoke tests
  # (nexus-inference `tests/*_smoke.rs` and nexus-reid `dinov2_core_smoke`;
  # `rect_shape_postprocess` also runs here but uses synthetic tensors and
  # needs no weights). The smoke tests need real ONNX weights, which are
  # not in git, and each one skips with a printed note -- exit 0 -- when its
  # file is missing, so the weights step below asserts every file exists
  # before they run.
  #
  # Apt cache (~200 MB of .debs) is persisted across runs via
  # `cache-apt-pkgs-action` — first run is ~20 s on the dev box of the
  # week, subsequent runs ~3 s. Before this caching the apt step was
  # 10–20 min of wall clock because Azure's apt mirrors are sometimes
  # painfully slow; everything past `apt install` only takes ~10 s.
  #
  # Package list has TWO tiers — `-dev` headers for the compile, runtime
  # plugins for the tests this job executes:
  #   * pkg-config: gstreamer-rs invokes pkg-config at build time.
  #   * libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev: gstreamer
  #     core + base .pc files & headers. These transitively pull every
  #     library gstreamer-rs links to (gstreamer-1.0, gstreamer-base-1.0,
  #     gstreamer-sdp-1.0, glib-2.0, gobject-2.0).
  #   * libgstreamer-plugins-bad1.0-dev: gstreamer-webrtc-1.0 .pc + headers
  #     for the `gstreamer-webrtc` feature (Phase 10 HD sub-pipeline).
  #   * gstreamer1.0-plugins-{base,good,bad,ugly} + gstreamer1.0-libav: the
  #     ELEMENTS, not headers. `alert_clip::gst_tests` launches real
  #     pipelines, and `gen_h264_nals` unwraps `parse::launch`, so a missing
  #     element is a panic rather than a skip. Covers videotestsrc /
  #     videoconvert / videoscale (base), qtdemux + mp4mux (good),
  #     h26Xparse (bad), x264enc (ugly), avdec_h26X (libav).
  # NOT installed (would be runtime-only / not exercised by this job):
  #   * libnice / gstreamer1.0-nice — webrtcbin's ICE backend. The
  #     `gstreamer-webrtc` tests mostly assert launch STRINGS, and the one
  #     that does instantiate an element
  #     (`negotiation_wiring_does_not_leak_the_webrtcbin`) builds a BARE
  #     `webrtcbin` and never negotiates, so it needs no ICE agent. That test
  #     does make `gstreamer1.0-plugins-bad` (installed above) load-bearing:
  #     it `return`s early when `webrtcbin` will not build, so dropping that
  #     package turns a leak regression into a silent pass.
  #   * libssl-dev (workspace uses rustls everywhere; Cargo.lock has no
  #     openssl / openssl-sys / native-tls — re-verify if that changes).
  #   * libunwind-dev (was needed only on ubuntu-22.04; 24.04 resolves
  #     libgstreamer1.0-dev's transitives clean).
  # ---------------------------------------------------------------------
  system-libs:
    name: rust (gstreamer + ort features)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'system-libs')
    steps:
      - uses: actions/checkout@v5

      - name: install rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-system-libs

      # `cache-apt-pkgs-action` resolves each package to an EXACT version from
      # the runner image's apt index, then fetches those versions. The image
      # ships a stale index, so once Ubuntu publishes a point release and drops
      # the superseded .deb from the pool, every fetch 404s:
      #
      #   E: Failed to fetch .../gstreamer1.0-plugins-good_1.24.2-1ubuntu1.5_amd64.deb  404
      #
      # The action then logs "Caching 0 installed packages" and EXITS 0, and the
      # empty result is saved under the cache key -- so every later run restores
      # a cache with nothing in it and reports "Cache restored successfully".
      # That is how this job failed on `main` from 2026-09-18 with nobody
      # alerted (it is not a required check). 1.24.2-1ubuntu1.5 -> 1ubuntu1.6 is
      # the same Ubuntu point release documented in issue #337.
      #
      # Refreshing the index first is the actual fix: the action then pins
      # versions that still exist in the pool.
      - name: refresh the apt index before the cached install
        run: sudo apt-get update -qq

      - name: install gstreamer dev headers + runtime plugins (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # Keyed by package list; bumping `version` invalidates the cache.
          # The -dev packages only provide headers. The `gst_tests` below
          # launch real pipelines, so the element plugins have to be present
          # too: videotestsrc/videoconvert (base), qtdemux+mp4mux (good),
          # h26Xparse (bad), x264enc (ugly), avdec_h26X (libav).
          # `libglib2.0-dev` is a transitive dep of libgstreamer1.0-dev, named
          # explicitly so a runner image that stops preinstalling it cannot
          # quietly drop `glib-2.0.pc` out of the cached set.
          packages: pkg-config libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          # 5 -> 7. 6 was burned by a run that cached the failed install above.
          version: 7

      # The caching action reports success whenever the cache *restores*,
      # regardless of whether the packages it was supposed to provide are
      # usable -- which is exactly how a green step shipped a toolchain with
      # no glib for three days. Assert the post-condition the next step
      # actually depends on, so a bad cache fails here with a clear message
      # instead of thousands of lines into a cargo build.
      - name: verify the gstreamer toolchain is actually usable
        run: |
          missing=0
          for pc in glib-2.0 gstreamer-1.0 gstreamer-plugins-base-1.0 gstreamer-plugins-bad-1.0; do
            if pkg-config --exists "$pc"; then
              echo "ok: $pc $(pkg-config --modversion "$pc")"
            else
              echo "MISSING: $pc"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::gstreamer toolchain missing after the install step. Most likely the apt index went stale and the pinned .debs 404d, leaving an empty cache; bump the cache-apt-pkgs-action \`version\` to evict it and check the install log above."
            exit 1
          fi

      # NOT in the cached list above, deliberately. `libgstlibav.so` links
      # `libblas.so.3`, which on Debian/Ubuntu is an update-alternatives
      # symlink created by the package's postinst — the caching action
      # restores package *files* and never runs maintainer scripts, so the
      # symlink is absent and the plugin fails to load, taking every
      # `avdec_*` element (and both alert-clip tests) with it. apt runs
      # postinst, so this one has to come from apt.
      - name: install libav's alternatives-managed BLAS runtime
        run: |
          sudo apt-get update -qq
          # --reinstall: the cache step may leave the package looking present
          # to dpkg, and a skipped install is a skipped postinst.
          sudo apt-get install -y --reinstall --no-install-recommends libblas3 liblapack3
          test -e /usr/lib/x86_64-linux-gnu/libblas.so.3

      - name: cache onnxruntime tarball
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: /opt/onnxruntime
          # ort 2.0.0-rc.12 (api-24 feature) binds to onnxruntime 1.24.x ABI; bump together.
          key: onnxruntime-linux-x64-1.24.1-v1

      - name: download onnxruntime shared lib
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          ORT_VERSION=1.24.1
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | sudo tar -xz -C /opt
          sudo mv /opt/onnxruntime-linux-x64-${ORT_VERSION} /opt/onnxruntime

      - name: export onnxruntime paths
        run: |
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "ORT_DYLIB_PATH=/opt/onnxruntime/lib/libonnxruntime.so"   >> $GITHUB_ENV

      # Weights for the smoke tests, from the `models-${pack_version}` GitHub
      # Release (the same source the engine release workflow bakes from).
      # Only what the tests load is fetched: the yolo26n / yoloe26_s /
      # yolo_world_v2_s ladders (pack_core_smoke walks all three shapes of
      # all three kinds), dinov2_s_224 and the manifest (pack_core_smoke
      # reads vocab from it), ~390 MB total. HEFs are skipped.
      # Cached on pack_version, which the manifest bumps whenever ONNX bytes
      # change, so a stale cache cannot outlive a model change.
      - name: read model pack version
        id: pack
        run: echo "version=$(jq -r .pack_version models/models-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: cache model weights
        id: models-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model-pack
          key: model-pack-${{ steps.pack.outputs.version }}

      - name: download model weights
        if: steps.models-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.pack.outputs.version }}
        run: |
          gh release download "models-${PACK_VERSION}" -R "${GITHUB_REPOSITORY}" \
            -D "${RUNNER_TEMP}/model-pack" --clobber \
            -p 'yolo26n_*x*.onnx' -p 'yoloe26_s_*x*.onnx' -p 'yolo_world_v2_s_*x*.onnx' \
            -p 'dinov2_s_224.onnx' -p models-manifest.json

      # A missing file here must fail the job: the tests below treat it as
      # "skip, pass". Also exports the env vars the tests read: NEXUS_TEST_PACK
      # (pack_core_smoke, dinov2_core_smoke) and the single-file smokes'
      # model/manifest vars, pointed at the 512x288 artifact of each kind
      # (the smokes take their input shape from the file name).
      - name: verify model weights and export test env
        run: |
          pack="${RUNNER_TEMP}/model-pack"
          missing=0
          for f in \
            yolo26n_512x288.onnx yolo26n_1024x576.onnx yolo26n_1536x864.onnx \
            yoloe26_s_512x288.onnx yoloe26_s_1024x576.onnx yoloe26_s_1536x864.onnx \
            yolo_world_v2_s_512x288.onnx yolo_world_v2_s_1024x576.onnx yolo_world_v2_s_1536x864.onnx \
            dinov2_s_224.onnx models-manifest.json; do
            if [ -s "${pack}/${f}" ]; then
              echo "ok: ${f}"
            else
              echo "MISSING: ${f}"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::model weights missing after download; the smoke tests would skip silently instead of failing."
            exit 1
          fi
          {
            echo "NEXUS_TEST_PACK=${pack}"
            echo "NEXUS_TEST_YOLO_MODEL=${pack}/yolo26n_512x288.onnx"
            echo "NEXUS_TEST_YOLOE_MODEL=${pack}/yoloe26_s_512x288.onnx"
            echo "NEXUS_TEST_YOLOE_MANIFEST=${pack}/models-manifest.json"
            echo "NEXUS_TEST_YOLO_WORLD_MODEL=${pack}/yolo_world_v2_s_512x288.onnx"
            echo "NEXUS_TEST_YOLO_WORLD_MANIFEST=${pack}/models-manifest.json"
          } >> "$GITHUB_ENV"

      # AGENTS.md rule 2 against the downloaded ONNX files: every file in
      # the pack must be named by the repo manifest and pass the
      # face-recognition name check. Not `--strict` for the reason given on
      # the `rust` job's step: missing licence fields warn, and every other
      # rule fails regardless. This job downloads the ONNX files only; the
      # release also ships the `*_hailo.hef` files, which are not audited
      # here.
      - name: cargo xtask check-models (downloaded weights)
        run: cargo xtask check-models --models-dir "${RUNNER_TEMP}/model-pack"

      # This is the only job in this workflow that compiles the gstreamer-gated
      # code, so it is the only place a warning there can fail CI; no clippy in
      # the `rust` job enables `gstreamer`. It used to `cargo check` these,
      # which prints a warning and exits 0, so a plain rebind (result left
      # unread) or a bare-statement discard of the result of
      # `register_analysis_sessions` in main.rs's gstreamer
      # `build_gst_recorder` was a warning on a green job; either now fails
      # this step. Because the boot map is an opaque `BootAnalysis`, a
      # rebind can no longer derive a doctored map from the first result,
      # and every form that still passes is a deliberate forge: dropping or
      # dead-reading the first result (`let _ =`, `drop`, an `_` binding, a
      # dead branch) plus a second, empty or throwaway, registration pass,
      # or feeding the one real pass an empty camera list.
      #   * Both feature levels: gstreamer-gated code under
      #     `cfg(not(feature = "gstreamer-webrtc"))` (e.g. the
      #     `WebRtcBridge::disabled()` arm inside main.rs's
      #     `build_gst_recorder`) compiles only in the gstreamer-only build.
      #   * Both crates: `-p nexus-engine` lints nexus-pipeline's lib but not
      #     its gstreamer test modules.
      #   * `--all-targets` lints that gated test code. It pulls in the
      #     dev-dependency tree and is this step's extra cost over the old
      #     checks until the rust-cache key next changes: dev-dependencies
      #     change shared dependencies' features (e.g. nexus-engine's
      #     `tokio/test-util` re-checks tokio, hyper, axum, sqlx and reqwest),
      #     and rust-cache saves only on a key miss, so that re-check repeats
      #     every run until then.
      # The ort lines in the next step stay `cargo check`; the `rust` job
      # lints nexus-inference's `ort` code on every PR (`cargo clippy
      # (nexus-inference, release EP features)`).
      - name: cargo clippy (gstreamer, deny warnings)
        run: |
          cargo clippy --locked -p nexus-pipeline --features gstreamer --all-targets -- -D warnings
          cargo clippy --locked -p nexus-pipeline --features gstreamer-webrtc --all-targets -- -D warnings
          cargo clippy --locked -p nexus-engine --features gstreamer --all-targets -- -D warnings
          cargo clippy --locked -p nexus-engine --features gstreamer-webrtc --all-targets -- -D warnings

      # The workspace `cargo test` job runs nexus-engine with default
      # features, so a test whose answer depends on `gstreamer` only ever
      # checks the non-gstreamer half there. The health roll-up's feature
      # gate is one: `EngineHealth::new` stuck at "no real recorder" passes
      # every default-feature test, and only
      # `only_a_gstreamer_build_raises_the_recorder_issue` on this build
      # fails it. The GIO override is the one the next step documents.
      - name: cargo test (nexus-engine, gstreamer)
        env:
          GIO_USE_PROXY_RESOLVER: dummy
        run: cargo test --locked -p nexus-engine --features gstreamer --bin nexus-engine

      - name: cargo check + test (gstreamer + ort)
        # `GIO_USE_PROXY_RESOLVER=dummy`: forces GIO to pick its no-op proxy
        # resolver extension instead of auto-probing for `gnome` (provided
        # by `glib-networking`, which this runner image ships even though
        # nothing above installs it). SPEC-069's P8 invariant tests are the
        # first in this suite to build TWO concurrent real `rtspsrc`
        # sessions for one camera (`a_camera_with_both_sessions_records_
        # from_the_main_ingester_only`, `nexus-pipeline`'s `gst_clip_
        # recorder.rs`) — that's what newly reaches the connection-attempt
        # code path that lazily constructs GIO's default proxy resolver.
        # `GProxyResolverGnome`'s constructor calls `g_settings_new
        # ("org.gnome.system.proxy")`, which is `g_error` (fatal, aborts
        # the process with SIGTRAP) when `gsettings-desktop-schemas` isn't
        # installed — true here, since this is a headless CI image, not a
        # GNOME desktop. Confirmed CI-only: this workflow's apt package
        # list is unchanged by SPEC-069, the same tests pass unmodified on
        # macOS (no `gnome` GIO proxy backend to probe there), and no
        # production code path calls proxy-resolution APIs — the camera
        # URLs here are deliberately-unroutable test fixtures
        # (`rtsp://127.0.0.1:1/...`), not real traffic. This only changes
        # what `cargo test` sees; a deployed core still uses the host's
        # real resolver.
        env:
          GIO_USE_PROXY_RESOLVER: dummy
        run: |
          # Same blind spot as the ort tests below: the workspace `cargo test`
          # job runs with default features, so `alert_clip::gst_tests` — which
          # encodes a real MP4 and asserts it decodes to EOS — never executes
          # there. This is the only job with a GStreamer runtime to run it.
          # `gstreamer-webrtc` implies `gstreamer`, so this one invocation also
          # covers webrtc.rs's launch-string assertions at no extra cost.
          # `--tests`, not `--lib`: the BUG-223 source-lifecycle and SPEC-075
          # F2 decode-health tests under `tests/` are gstreamer-gated too.
          cargo test  --locked -p nexus-pipeline  --features gstreamer-webrtc --tests
          cargo check --locked -p nexus-inference --features ort,ep-cpu
          # The workspace `cargo test` job runs with default features, so
          # everything behind `#![cfg(feature = "ort")]` is invisible to it.
          # The always-on job covers `session_tuning`; this is the only job
          # that can execute the rest, which needs the real runtime.
          # `--tests`, not `--lib`: `--lib` skips tests/ entirely, which is
          # where the model-backed smoke tests live. They read
          # the NEXUS_TEST_* vars exported by the weights step above.
          cargo test  --locked -p nexus-inference --features ort,ep-cpu --tests
          # CUDA execution provider: compile-only. No GitHub-hosted runner
          # has an NVIDIA GPU, and the CUDA provider is dlopen'd at session
          # open, so this gates the ep-cuda code path (CUDAExecutionProvider
          # builder API) without needing hardware. Real attachment is
          # verified manually on the reference box.
          cargo check --locked -p nexus-inference --features ort,ep-cuda
          # ep-cpu implies `ort`, so this is the only job that compiles the
          # cfg(feature = "ort") DINOv2 extractor (nexus-reid/src/ort_dinov2.rs).
          cargo check --locked -p nexus-reid      --features ep-cpu
          # dinov2_core_smoke (`#![cfg(feature = "ort")]`; ep-cpu implies ort)
          # loads dinov2_s_224.onnx from NEXUS_TEST_PACK.
          cargo test  --locked -p nexus-reid      --features ep-cpu --tests
